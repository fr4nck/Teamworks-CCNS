name: Frankenstein mailer mutable defaults

on:
  pull_request:
    paths:
      - 'teamworks/Dlg/DLG_Mailer.py'
      - 'tools/rewrite_mailer_mutable_defaults.py'
      - '.github/workflows/frankenstein-mailer-defaults.yml'

permissions:
  contents: write

jobs:
  rewrite-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rewrite mutable defaults
        run: python tools/rewrite_mailer_mutable_defaults.py
      - name: Compile mailer
        run: python -m py_compile teamworks/Dlg/DLG_Mailer.py
      - name: Verify targeted defaults
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('teamworks/Dlg/DLG_Mailer.py').read_bytes().decode('iso-8859-15')
          tree = ast.parse(source)
          targets = {'SetDonnees': 'donnees', 'Envoyer': 'listeDestinataires', 'VerifieFusion': 'listeDestinataires', 'SetPiecesJointes': 'listeFichiers'}
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef) and node.name in targets:
                  args = node.args.args
                  defaults = node.args.defaults
                  offset = len(args) - len(defaults)
                  for index, arg in enumerate(args):
                      if arg.arg == targets[node.name] and index >= offset:
                          assert isinstance(defaults[index-offset], ast.Constant)
                          assert defaults[index-offset].value is None
          PY
      - name: Commit mechanical cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Mailer.py
          git commit -m "refactor: sécuriser les paramètres mutables du mailer"
          git push origin HEAD:${{ github.head_ref }}
