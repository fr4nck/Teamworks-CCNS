name: Stabilisation checklist controls smoke

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/smoke_checklist_controls.py"
      - "teamworks/Ctrl/CTRL_Creation_modele_contrat_p1.py"
      - "teamworks/Dlg/DLG_Application_modele.py"
      - "teamworks/Dlg/DLG_Config_gadgets.py"
      - "teamworks/Dlg/DLG_Config_liste_personnes.py"
      - "teamworks/Dlg/DLG_Impression_frais.py"
      - "teamworks/Dlg/DLG_Publiposteur_Choix.py"
      - "teamworks/Dlg/DLG_Saisie_remboursement.py"
      - "teamworks/Dlg/DLG_Selection_liste.py"
      - "teamworks/Dlg/DLG_Statistiques.py"
      - "tests/test_checklistctrl_inventory.py"
      - ".github/workflows/stabilisation-checklist-controls-smoke.yml"
  workflow_dispatch:

jobs:
  checklist-controls:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/python311-core.txt

      - name: Construct secondary checklist controls
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: python tools/smoke_checklist_controls.py

      - name: Upload checklist diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-controls-smoke-diagnostic
          path: artifacts/checklist-controls-smoke/diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail when checklist smoke failed
        if: always() && steps.smoke.outcome == 'failure'
        shell: pwsh
        run: throw "Le smoke des contrôles secondaires a échoué."
