name: Update roadmap after TW-101

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/update-roadmap-tw101.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update central roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/FEUILLE_ROUTE_MAINTENANCE.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '| TW-101 | Remplacer le fallback `SetAlphaData()` de `ThumbnailCtrl` par `wx.Image.SetAlpha()` | En cours | PR #172 | correctif appliqué, test ciblé vert, workflow temporaire retiré |': '| TW-101 | Remplacer le fallback `SetAlphaData()` de `ThumbnailCtrl` par `wx.Image.SetAlpha()` | Terminé | PR #172 · `1ba77fc0` | correctif fusionné, test ciblé vert, aucun workflow temporaire dans le diff final |',
              '| TW-102 | Recenser et remplacer les usages résiduels de `wx.BitmapFromImage` | À cadrer | — | inventaire exact, remplacement testé, aucune régression visuelle connue |': '| TW-102 | Recenser et remplacer les usages résiduels de `wx.BitmapFromImage` | En cours | inventaire initial : 9 appels actifs | remplacement Phoenix direct, test statique et CI verte |',
              '| Migration Python 3 / Phoenix | 88 % | terminer TW-101 puis produire l\'inventaire réel des API Classic restantes |': '| Migration Python 3 / Phoenix | 89 % | exécuter TW-102 sur les appels `wx.BitmapFromImage` confirmés |',
              '1. terminer TW-101;': '1. exécuter TW-102 sur les usages `wx.BitmapFromImage` confirmés ;',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing roadmap marker: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/update-roadmap-tw101.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEUILLE_ROUTE_MAINTENANCE.md .github/workflows/update-roadmap-tw101.yml
          git commit -m "Docs — clôturer TW-101 et activer TW-102"
          git push
