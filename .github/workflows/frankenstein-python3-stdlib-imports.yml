name: Frankenstein Python 3 stdlib imports

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_python3_stdlib_imports.py"
      - ".github/workflows/frankenstein-python3-stdlib-imports.yml"
      - "teamworks/Dlg/DLG_Teamword.py"
      - "teamworks/Utils/UTILS_Html2text.py"
      - "teamworks/Ctrl/CTRL_thumbnailctrl.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Migrate Python 3 standard-library imports
        run: python tools/migrate_python3_stdlib_imports.py --write

      - name: Verify migration idempotence
        run: python tools/migrate_python3_stdlib_imports.py --check

      - name: Compile migrated sources
        run: |
          python -m compileall -q \
            teamworks/Dlg/DLG_Teamword.py \
            teamworks/Utils/UTILS_Html2text.py \
            teamworks/Ctrl/CTRL_thumbnailctrl.py

      - name: Commit migrated sources
        run: |
          if git diff --quiet -- \
            teamworks/Dlg/DLG_Teamword.py \
            teamworks/Utils/UTILS_Html2text.py \
            teamworks/Ctrl/CTRL_thumbnailctrl.py; then
            echo "No Python 3 stdlib migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            teamworks/Dlg/DLG_Teamword.py \
            teamworks/Utils/UTILS_Html2text.py \
            teamworks/Ctrl/CTRL_thumbnailctrl.py
          git commit -m "Frankenstein lot 2 — migrer les imports standard Python 3"
          git pull --rebase origin frankenstein/python3-wxphoenix-lot2
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
