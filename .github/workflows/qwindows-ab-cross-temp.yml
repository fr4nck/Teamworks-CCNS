name: Qualification temporaire qwindows A-B cross #381

on:
  push:
    branches:
      - PMSL35/qt-convergence-377-378-380

permissions:
  contents: read

jobs:
  windows-native:
    name: qwindows A-B timer/poll cross Windows 2022
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}\teamworks;${{ github.workspace }}
      TEAMWORKS_QT_NATIVE_WINDOWS_REQUIRED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/python311-core.txt
            .github/requirements-ci.txt
            poc/qt-theme/requirements.txt

      - name: Installer dépendances
        shell: pwsh
        run: |
          python -m pip install --requirement requirements/python311-core.txt
          python -m pip install --requirement .github/requirements-ci.txt
          python -m pip install --requirement poc/qt-theme/requirements.txt
          python -c "import PySide6; print('PySide6=' + PySide6.__version__)"

      - name: Compiler le probe
        shell: pwsh
        run: python -m py_compile poc/qt-theme/qwindows_ab_cross_probe.py poc/qt-theme/runtime_async_smoke.py poc/qt-theme/pilot_generalities.py

      - name: Croisement minimal A-B qwindows
        shell: pwsh
        working-directory: poc/qt-theme
        run: |
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $python = (Get-Command python).Source
          $cases = @(
            "timer-poll-race",
            "timer-poll-race-tabs",
            "timer-poll-finished",
            "timer-poll-finished-tabs",
            "timer-loop-race",
            "timer-loop-race-tabs",
            "timer-loop-finished",
            "blocking-poll-race-tabs"
          )
          foreach ($case in $cases) {
            1..3 | ForEach-Object {
              Write-Host "PROBE START case=$case iteration=$_"
              $p = Start-Process -FilePath $python -ArgumentList @("qwindows_ab_cross_probe.py", $case) -NoNewWindow -Wait -PassThru
              Write-Host "PROBE RESULT case=$case iteration=$_ exit=$($p.ExitCode)"
            }
          }
          Write-Host "PROBE MATRIX COMPLETE"
