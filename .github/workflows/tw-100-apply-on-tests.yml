name: TW-100 apply ThumbnailCtrl after tests

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tw-100-thumbnailctrl-image-phoenix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Phoenix-only image loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('teamworks/Ctrl/CTRL_thumbnailctrl.py')
          data = path.read_bytes()
          text = data.decode('iso-8859-15')
          old = """def getShadow():\n    if 'phoenix' in wx.PlatformInfo:\n        fonction = wx.Image\n    else :\n        fonction = wx.ImageFromStream\n    sh_tr = fonction(six.BytesIO(getDataTR())).ConvertToBitmap()\n    sh_bl = fonction(six.BytesIO(getDataBL())).ConvertToBitmap()\n    sh_sh = fonction(six.BytesIO(getDataSH())).Rescale(500, 500, wx.IMAGE_QUALITY_HIGH)\n"""
          new = """def getShadow():\n    sh_tr = wx.Image(six.BytesIO(getDataTR())).ConvertToBitmap()\n    sh_bl = wx.Image(six.BytesIO(getDataBL())).ConvertToBitmap()\n    sh_sh = wx.Image(six.BytesIO(getDataSH())).Rescale(500, 500, wx.IMAGE_QUALITY_HIGH)\n"""
          if old not in text:
              raise SystemExit('Expected getShadow block not found')
          text = text.replace(old, new, 1)
          text = text.replace('# -*- coding: iso-8859-15 -*-', '# -*- coding: utf-8 -*-', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate and push
        run: |
          python -m py_compile teamworks/Ctrl/CTRL_thumbnailctrl.py
          python -m pytest -q tests/test_thumbnailctrl_phoenix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_thumbnailctrl.py
          git commit -m "TW-100 — Moderniser le chargement des ombres ThumbnailCtrl"
          git push origin HEAD:agent/tw-100-thumbnailctrl-image-phoenix
