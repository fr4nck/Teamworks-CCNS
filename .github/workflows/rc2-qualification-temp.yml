name: Qualification temporaire RC2

on:
  push:
    branches:
      - fix/rc1-recette-bugs-20260908

permissions:
  contents: read

jobs:
  linux-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Compiler les fichiers RC2
        run: >-
          python -m compileall -q
          teamworks/Dlg/DLG_Publiposteur_lifecycle.py
          teamworks/Dlg/DLG_Saisie_champs_publipostage.py
          teamworks/Dlg/DLG_Parametres_horloge.py
          teamworks/Ctrl/CTRL_Creation_contrat_p4.py
          teamworks/Utils/UTILS_Publipostage_donnees.py
          teamworks/Utils/UTILS_Publipostage_donnees_rc2.py
          teamworks/Dlg/__init__.py
          teamworks/Utils/__init__.py
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
      - name: Tests ciblés RC2
        run: >-
          python -m pytest -q
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
          tests/test_secondary_contract_smoke_contract.py
          tests/test_ccns_contract_compliance_presenter.py

  windows-targeted:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt
      - name: Installer le socle Windows
        shell: pwsh
        run: |
          python -m pip install --requirement requirements/python311-core.txt
          python -m pip install pytest
      - name: Compiler les fichiers RC2
        shell: pwsh
        run: >-
          python -m compileall -q
          teamworks/Dlg/DLG_Publiposteur_lifecycle.py
          teamworks/Dlg/DLG_Saisie_champs_publipostage.py
          teamworks/Dlg/DLG_Parametres_horloge.py
          teamworks/Ctrl/CTRL_Creation_contrat_p4.py
          teamworks/Utils/UTILS_Publipostage_donnees.py
          teamworks/Utils/UTILS_Publipostage_donnees_rc2.py
          teamworks/Dlg/__init__.py
          teamworks/Utils/__init__.py
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
      - name: Tests ciblés RC2 Windows
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
          tests/test_secondary_contract_smoke_contract.py
          tests/test_ccns_contract_compliance_presenter.py
