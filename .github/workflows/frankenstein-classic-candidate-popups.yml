name: Frankenstein remove Classic candidate popups

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_classic_candidate_popups.py"
      - ".github/workflows/frankenstein-classic-candidate-popups.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove Classic candidate popup bindings
        run: python tools/migrate_classic_candidate_popups.py --write

      - name: Verify migration idempotence
        run: python tools/migrate_classic_candidate_popups.py --check

      - name: Compile migrated sources
        run: python -m compileall -q teamworks/Ol/OL_candidats.py teamworks/Ol/OL_candidatures.py

      - name: Commit migrated sources
        run: |
          if git diff --quiet -- teamworks/Ol/OL_candidats.py teamworks/Ol/OL_candidatures.py; then
            echo "No candidate popup migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ol/OL_candidats.py teamworks/Ol/OL_candidatures.py
          git commit -m "Frankenstein lot 2 — retirer les popups Classic candidats"
          git pull --rebase origin frankenstein/python3-wxphoenix-lot2
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
