name: Stabilisation fix contract listctrl

on:
  pull_request:
    branches:
      - master
    paths:
      - "tools/fix_contract_listctrl_phoenix.py"
      - ".github/workflows/stabilisation-fix-contract-listctrl.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilisation/recette-fonctionnelle-secondaire

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply contract list correction
        run: python tools/fix_contract_listctrl_phoenix.py

      - name: Verify contract list correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('teamworks/Ctrl/CTRL_Creation_contrat_p4.py')
          source = path.read_text(encoding='iso-8859-15')
          assert 'six.MAXSIZE' not in source
          assert 'InsertItem(sys.maxsize,' not in source
          assert 'InsertStringItem(sys.maxsize,' not in source
          assert 'InsertItem(self.GetItemCount(),' in source
          marker = "if 'phoenix' in wx.PlatformInfo:\n            self.EnableCheckBoxes(True)"
          assert source.count(marker) == 1
          compile(source, str(path), 'exec')
          PY

      - name: Commit corrected contract page
        shell: bash
        run: |
          if git diff --quiet -- teamworks/Ctrl/CTRL_Creation_contrat_p4.py; then
            echo "Contract list already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_Creation_contrat_p4.py
          git commit -m "Stabilisation — corriger la liste des champs contrat sous Phoenix"
          git push origin HEAD:stabilisation/recette-fonctionnelle-secondaire
