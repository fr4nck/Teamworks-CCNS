name: Nettoyage ponctuel workflows obsoletes

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  cleanup-obsolete:
    name: Purge des anciens workflows
    if: ${{ contains(github.event.head_commit.message, '[cleanup-obsolete-now]') }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Supprimer les runs des workflows obsoletes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/cleanup_github_actions.ps1
          -Repo $env:GITHUB_REPOSITORY
          -KeepPerWorkflow 20
          -OnlyObsoleteWorkflows
          -Apply
