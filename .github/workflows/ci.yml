name: Validation Qt

on:
  pull_request:
    branches:
      - qt/master
      - qt/convergence-0.9.2-rc3
      - qt/vanilla-0.1-rc
  push:
    branches:
      - qt/master
      - qt/vanilla-0.1-rc
  workflow_dispatch:

concurrency:
  group: teamworks-qt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  tests-linux:
    name: Socle et tests Qt — Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            .github/requirements-ci.txt
            poc/qt-theme/requirements.txt

      - name: Installer les bibliothèques Qt système
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Installer les dépendances
        run: |
          python -m pip install --requirement .github/requirements-ci.txt
          python -m pip install --requirement poc/qt-theme/requirements.txt

      - name: Compiler tout le code Python
        run: python -m compileall -q application domain infrastructure scripts tools teamworks tests poc/qt-theme

      - name: Contrôler la politique UTF-8
        run: python scripts/check_utf8.py

      - name: Contrôler les composants essentiels
        run: python scripts/check_essential_runtime.py

      - name: Auditer les risques de compatibilité
        run: >-
          python scripts/audit_runtime_risks.py .
          --fail-on-python2-builtins
          --fail-on-missing-handlers
          --json runtime-risk-audit.json

      - name: Exécuter la suite fonctionnelle hors contrats de packaging wx
        run: >-
          python -m pytest -q
          --deselect=tests/test_main_navigation_smoke_contract.py::test_windows_navigation_smoke_is_part_of_critical_ci
          --deselect=tests/test_mysql_connection_compatibility.py::test_windows_build_collects_the_complete_mysql_connector_package
          --deselect=tests/test_windows_installer_contract.py::test_windows_packages_are_not_built_on_every_commit

  qt-windows-native:
    name: Qt natif — Windows
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      TEAMWORKS_QT_NATIVE_WINDOWS_REQUIRED: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/python311-core.txt
            poc/qt-theme/requirements.txt

      - name: Installer le socle et Qt
        shell: pwsh
        run: |
          python -m pip install --requirement requirements/python311-core.txt
          python -m pip install --requirement poc/qt-theme/requirements.txt
          python -m pip install pytest

      - name: Préparer le PYTHONPATH natif
        shell: pwsh
        run: |
          "PYTHONPATH=$pwd\teamworks;$pwd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue

      - name: Vérifier les contrats Qt et le lifecycle QThread
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_qt_contract_identity.py `
            tests/test_qt_contract_classification.py `
            tests/test_qt_contract_write_roundtrip.py `
            tests/test_qt_contract_documents.py `
            tests/test_qt_expense_reimbursement_roundtrip.py `
            tests/test_qt_presence_integration.py `
            tests/test_qt_blocking_thread_lifecycle_runtime.py
      - name: Démarrer MySQL local pour la recette Frais
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "8.0.46"
          $archive = Join-Path $env:RUNNER_TEMP "mysql-$version-winx64.zip"
          $base = Join-Path $env:RUNNER_TEMP "mysql-$version-winx64"
          $data = Join-Path $env:RUNNER_TEMP "mysql-data"
          $log = Join-Path $env:RUNNER_TEMP "mysql-error.log"

          if (-not (Test-Path (Join-Path $base "bin\mysqld.exe"))) {
            curl.exe -L --fail --retry 3 "https://dev.mysql.com/get/Downloads/MySQL-8.0/mysql-$version-winx64.zip" -o $archive
            if ($LASTEXITCODE -ne 0) { throw "Échec du téléchargement MySQL $version" }
            7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
          }

          $mysqld = Join-Path $base "bin\mysqld.exe"
          if (-not (Test-Path $mysqld)) {
            throw "mysqld.exe introuvable après installation de MySQL $version"
          }

          if (Test-Path $data) { Remove-Item $data -Recurse -Force }
          New-Item -ItemType Directory -Path $data | Out-Null

          & $mysqld --no-defaults --initialize-insecure "--basedir=$base" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { throw "Échec de l initialisation MySQL" }

          $process = Start-Process -FilePath $mysqld -ArgumentList @(
            "--no-defaults",
            "--basedir=$base",
            "--datadir=$data",
            "--port=3307",
            "--bind-address=127.0.0.1",
            "--skip-log-bin",
            "--log-error=$log"
          ) -PassThru

          "TEAMWORKS_MYSQL_INTEGRATION=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEAMWORKS_MYSQL_HOST=127.0.0.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEAMWORKS_MYSQL_PORT=3307" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEAMWORKS_MYSQL_USER=root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEAMWORKS_MYSQL_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEAMWORKS_MYSQL_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          import time
          import mysql.connector

          last = None
          for _ in range(60):
              try:
                  connection = mysql.connector.connect(
                      host="127.0.0.1",
                      port=3307,
                      user="root",
                      password="",
                      use_pure=True,
                      ssl_disabled=True,
                      connection_timeout=2,
                  )
                  cursor = connection.cursor()
                  cursor.execute("SELECT VERSION()")
                  print("[Teamworks MySQL CI] serveur prêt :", cursor.fetchone()[0])
                  cursor.close()
                  connection.close()
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(1)
          else:
              raise SystemExit("MySQL indisponible après 60s: %r" % (last,))
          '@ | python -

      - name: Recette réelle Frais — Windows + MySQL
        shell: pwsh
        run: python -m pytest -q tests/test_mysql_expense_roundtrip.py

      - name: Smoke runtime Qt Windows natif
        shell: pwsh
        run: python poc/qt-theme/runtime_async_smoke.py

      - name: Benchmark de frugalité Qt
        shell: pwsh
        run: python poc/qt-theme/benchmark_models.py
