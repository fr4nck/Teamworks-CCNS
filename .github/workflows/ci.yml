name: Qualification Vanilla wx 0.9.2-rc2

on:
  push:
    branches:
      - release/vanilla-wx-0.9.2-rc2
  workflow_dispatch:

concurrency:
  group: vanilla-wx-0.9.2-rc2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-tests:
    name: CI Linux complète
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Installer les dépendances de test
        run: python -m pip install --requirement .github/requirements-ci.txt

      - name: Vérifier la version RC2
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "0.9.2-rc2"

      - name: Compiler le code Python
        run: python -m compileall -q application domain infrastructure scripts tools teamworks tests

      - name: Contrôler UTF-8
        run: python scripts/check_utf8.py

      - name: Contrôler les composants essentiels
        run: python scripts/check_essential_runtime.py

      - name: Auditer les risques runtime
        run: >-
          python scripts/audit_runtime_risks.py .
          --fail-on-python2-builtins
          --fail-on-missing-handlers
          --json runtime-risk-audit.json

      - name: Contrôler les branches Phoenix redondantes
        run: python tools/find_redundant_phoenix_branches.py teamworks/Ctrl --check

      - name: Exécuter toute la suite pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-linux.txt

      - name: Publier le résultat pytest Linux
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rc2-pytest-linux
          path: |
            pytest-linux.txt
            runtime-risk-audit.json
          if-no-files-found: warn
          retention-days: 7

  windows-tests:
    name: Tests ciblés et smokes Windows
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt

      - name: Installer le socle Windows
        shell: pwsh
        run: |
          python -m pip install --requirement requirements/python311-core.txt
          python -m pip install pytest

      - name: Vérifier la version RC2
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '0.9.2-rc2') { throw "VERSION inattendue : $version" }

      - name: Compiler les modules wx et tests
        shell: pwsh
        run: >-
          python -m compileall -q
          teamworks
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
          tests/test_dpae_due_rc1.py
          tests/test_redirect_flush_rc1.py
          tests/test_wx_personnes_performance.py
          tests/test_wx_presences_performance.py
          tests/test_wx_presences_db_scope.py
          tests/test_wx_personnes_column_persistence.py
          tests/test_wx_personnes_publipostage_id.py
          tests/test_utils_styles_window_geometry.py
          tests/test_dialog_root_panel_sizers.py
          tests/test_questionnaire_question_creation_regression.py

      - name: Tests RC2 et garde-fous protégés
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_parametres_defaults_db_rc1.py `
            tests/test_rc2_recette_regressions.py `
            tests/test_dpae_due_rc1.py `
            tests/test_redirect_flush_rc1.py `
            tests/test_wx_personnes_performance.py `
            tests/test_wx_presences_performance.py `
            tests/test_wx_presences_db_scope.py `
            tests/test_wx_personnes_column_persistence.py `
            tests/test_wx_personnes_publipostage_id.py `
            tests/test_utils_styles_window_geometry.py `
            tests/test_dialog_root_panel_sizers.py `
            tests/test_questionnaire_question_creation_regression.py `
            tests/test_secondary_presence_smoke_contract.py `
            tests/test_secondary_person_smoke_contract.py `
            tests/test_secondary_contract_smoke_contract.py `
            2>&1 | Tee-Object -FilePath pytest-windows-targeted.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exécuter les parcours critiques Windows
        shell: pwsh
        run: |
          $failures = @()
          function Invoke-Smoke {
            param([string]$Name, [string[]]$Arguments)
            Write-Host "::group::$Name"
            & python @Arguments
            $exitCode = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($exitCode -ne 0) { $script:failures += $Name }
          }

          Invoke-Smoke "Sauvegarde et restauration" @("tools/smoke_backup_restore.py")
          Invoke-Smoke "Contrôles des checklists" @("tools/smoke_checklist_controls.py")
          Invoke-Smoke "Dialogue contrat" @("tools/smoke_secondary_contract_dialog.py")
          Invoke-Smoke "Exports" @("tools/smoke_exports.py")
          Invoke-Smoke "Impression PDF" @("tools/smoke_pdf_impression.py")
          Invoke-Smoke "Navigation et thème sombre" @("tools/smoke_main_navigation.py")
          Invoke-Smoke "Fiche personne" @("tools/smoke_secondary_person_dialog.py")
          Invoke-Smoke "Saisie présence" @("tools/smoke_secondary_presence_dialog.py")
          Invoke-Smoke "Recrutement" @("tools/smoke_secondary_recruitment.py")
          Invoke-Smoke "Questionnaire" @("tools/smoke_questionnaire_lifecycle.py")

          New-Item -ItemType Directory -Force functional-report | Out-Null
          Invoke-Smoke "Aller-retour base fonctionnelle" @(
            "tools/functional_db_roundtrip.py",
            "--output-dir",
            "functional-report",
            "--json"
          )

          if ($failures.Count -gt 0) {
            $failures | Set-Content windows-smoke-failures.txt
            throw "Parcours en échec : $($failures -join ', ')"
          }
          Set-Content windows-smoke-failures.txt -Value ""

      - name: Publier les diagnostics Windows
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rc2-tests-windows
          path: |
            pytest-windows-targeted.txt
            windows-smoke-failures.txt
            artifacts/**
            functional-report/**
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    name: Construire la candidate Windows RC2
    needs:
      - linux-tests
      - windows-tests
    if: ${{ needs.linux-tests.result == 'success' && needs.windows-tests.result == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-windows-build.txt

      - name: Installer les dépendances de build
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r .github/requirements-windows-build.txt
          python -m pip freeze | Set-Content build-requirements.txt

      - name: Verrouiller la version à 0.9.2-rc2
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne '0.9.2-rc2') { throw "VERSION inattendue : $version" }

      - name: Inventorier les modules du paquet
        shell: pwsh
        run: |
          $modules = @()
          Get-ChildItem teamworks -Recurse -Filter '*.py' -File | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath((Resolve-Path teamworks).Path, $_.FullName)
            $module = [System.IO.Path]::ChangeExtension($relative, $null) -replace '[\\/]', '.'
            if ($module.EndsWith('.__init__')) { $module = $module.Substring(0, $module.Length - 9) }
            if ($module -and $module -ne '__init__') { $modules += $module }
          }
          foreach ($root in @('domain', 'application', 'infrastructure')) {
            Get-ChildItem $root -Recurse -Filter '*.py' -File | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              $module = [System.IO.Path]::ChangeExtension($relative, $null) -replace '[\\/]', '.'
              if ($module.EndsWith('.__init__')) { $module = $module.Substring(0, $module.Length - 9) }
              if ($module) { $modules += $module }
            }
          }
          $modules = $modules | Sort-Object -Unique
          if ($modules.Count -lt 250) { throw "Inventaire des modules anormalement petit : $($modules.Count)" }
          New-Item -ItemType Directory -Force build | Out-Null
          $modules | Set-Content build/internal-modules.txt

      - name: Construire l'application portable
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $modules = Get-Content build/internal-modules.txt
          $icon = (Resolve-Path 'teamworks/Static/Images/Branding/Teamworks-CCNS.ico').Path
          $pyinstallerArgs = @(
            '-m', 'PyInstaller',
            '--noconfirm',
            '--clean',
            '--windowed',
            '--onedir',
            '--name', 'Teamworks-CCNS',
            '--icon', $icon,
            '--paths', '.',
            '--paths', 'teamworks',
            '--distpath', 'dist',
            '--workpath', 'build/pyinstaller',
            '--specpath', 'build/spec',
            '--collect-all', 'reportlab',
            '--collect-all', 'PIL',
            '--collect-all', 'mysql.connector',
            '--hidden-import', 'win32com.client'
          )
          foreach ($module in $modules) { $pyinstallerArgs += @('--hidden-import', $module) }
          $pyinstallerArgs += 'teamworks/Teamworks.py'
          python @pyinstallerArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller a échoué avec le code $LASTEXITCODE" }

          $package = 'dist/Teamworks-CCNS'
          Copy-Item teamworks/Static "$package/Static" -Recurse -Force
          if (Test-Path teamworks/Data) { Copy-Item teamworks/Data "$package/Data" -Recurse -Force }
          Copy-Item teamworks/Versions.txt "$package/Versions.txt" -Force
          Copy-Item VERSION "$package/VERSION" -Force
          Copy-Item ROADMAP.md "$package/ROADMAP.md" -Force
          Copy-Item build/internal-modules.txt "$package/INTERNAL-MODULES.txt" -Force
          Copy-Item build-requirements.txt "$package/BUILD-REQUIREMENTS.txt" -Force
          Set-Content -Path "$package/BUILD.txt" -Value "Teamworks-CCNS $version`nCommit $env:GITHUB_SHA"

      - name: Valider le contenu et l'identité du paquet
        shell: pwsh
        run: |
          $package = 'dist/Teamworks-CCNS'
          $requiredFiles = @(
            'Teamworks-CCNS.exe',
            'Static',
            'Versions.txt',
            'VERSION',
            'BUILD.txt',
            'ROADMAP.md',
            'INTERNAL-MODULES.txt',
            'BUILD-REQUIREMENTS.txt'
          )
          foreach ($required in $requiredFiles) {
            if (-not (Test-Path "$package/$required")) { throw "$required est absent" }
          }

          $packageVersion = (Get-Content "$package/VERSION" -Raw).Trim()
          if ($packageVersion -ne '0.9.2-rc2') { throw "VERSION du paquet inattendue : $packageVersion" }
          $buildText = Get-Content "$package/BUILD.txt" -Raw
          if (-not $buildText.Contains("Teamworks-CCNS 0.9.2-rc2")) { throw 'BUILD.txt ne contient pas 0.9.2-rc2' }
          if (-not $buildText.Contains("Commit $env:GITHUB_SHA")) { throw "BUILD.txt ne contient pas le SHA $env:GITHUB_SHA" }

          $manifest = @(Get-Content "$package/INTERNAL-MODULES.txt")
          if ($manifest.Count -lt 250) { throw "Manifeste des modules anormalement petit : $($manifest.Count)" }
          foreach ($prefix in @('Ctrl.','Dlg.','Ol.','Utils.','CcnsCore.','domain.','application.','infrastructure.')) {
            if (-not ($manifest | Where-Object { $_.StartsWith($prefix) } | Select-Object -First 1)) {
              throw "Aucun module inclus pour le préfixe : $prefix"
            }
          }

      - name: Tester le démarrage de l'exécutable
        shell: pwsh
        run: ./scripts/test_windows_executable.ps1

      - name: Publier les journaux de démarrage en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rc2-journaux-demarrage-windows
          path: |
            teamworks-smoke.stdout.log
            teamworks-smoke.stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Créer et vérifier le manifeste d'intégrité
        shell: pwsh
        run: |
          $package = Resolve-Path 'dist/Teamworks-CCNS'
          $manifestPath = Join-Path $package.Path 'PACKAGE-SHA256SUMS.txt'
          Get-ChildItem $package -Recurse -File |
            Where-Object { $_.FullName -ne $manifestPath } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($package.Path, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Set-Content $manifestPath -Encoding utf8

          $entries = @(Get-Content $manifestPath -Encoding utf8)
          if ($entries.Count -eq 0) { throw "Le manifeste d'intégrité est vide" }
          foreach ($entry in $entries) {
            if ($entry -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Entrée invalide : $entry" }
            $expected = $Matches[1]
            $relative = $Matches[2]
            $target = Join-Path $package.Path ($relative.Replace('/', [System.IO.Path]::DirectorySeparatorChar))
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Fichier du manifeste absent : $relative" }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Empreinte incorrecte : $relative" }
          }

      - name: Créer l'archive portable
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = "Teamworks-CCNS-$version-windows-x64.zip"
          Compress-Archive -Path 'dist/Teamworks-CCNS/*' -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Créer l'installateur Windows
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Compilateur Inno Setup introuvable : $iscc" }
          & $iscc "/DAppVersion=$version" 'packaging/windows/Teamworks-CCNS.iss'
          if ($LASTEXITCODE -ne 0) { throw "La compilation de l'installateur a échoué avec le code $LASTEXITCODE" }
          $installer = Get-ChildItem 'dist/installer/Teamworks-CCNS-*-windows-x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "L'installateur Windows est absent" }
          if (-not $installer.Name.Contains('0.9.2-rc2')) { throw "Nom d'installateur inattendu : $($installer.Name)" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Add-Content SHA256SUMS.txt -Encoding ascii

      - name: Publier la candidate RC2 sans GitHub Release
        uses: actions/upload-artifact@v6
        with:
          name: Teamworks-CCNS-0.9.2-rc2-Windows
          path: |
            Teamworks-CCNS-0.9.2-rc2-windows-x64.zip
            dist/installer/Teamworks-CCNS-0.9.2-rc2-windows-x64-setup.exe
            dist/Teamworks-CCNS/BUILD.txt
            dist/Teamworks-CCNS/VERSION
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
