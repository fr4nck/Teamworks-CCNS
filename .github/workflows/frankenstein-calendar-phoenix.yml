name: Frankenstein calendar Phoenix cleanup

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_calendar_phoenix_only.py"
      - ".github/workflows/frankenstein-calendar-phoenix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply calendar Phoenix cleanup
        run: python tools/migrate_calendar_phoenix_only.py --write

      - name: Verify migration idempotence
        run: python tools/migrate_calendar_phoenix_only.py --check

      - name: Compile migrated source
        run: python -m compileall -q teamworks/Ctrl/CTRL_Calendrier_tw.py

      - name: Commit migrated calendar
        run: |
          if git diff --quiet -- teamworks/Ctrl/CTRL_Calendrier_tw.py; then
            echo "No calendar cleanup required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_Calendrier_tw.py
          git commit -m "Frankenstein lot 2 — retirer les branches Classic du calendrier"
          git pull --rebase origin frankenstein/python3-wxphoenix-lot2
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
