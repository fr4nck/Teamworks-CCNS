name: tmp-frais-decimal-on-402
on:
  push:
    branches:
      - fix/0.9.2-frais-integrite-impression-distance
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.9.2-frais-integrite-impression-distance
      - name: Patch Decimal
        shell: python
        run: |
          from pathlib import Path
          p = Path('teamworks/Dlg/DLG_Impression_frais.py')
          s = p.read_text(encoding='utf-8')
          if 'from decimal import Decimal, ROUND_HALF_UP\n' not in s:
              s = s.replace('import datetime\n', 'import datetime\nfrom decimal import Decimal, ROUND_HALF_UP\n', 1)
          if 'def _montant_decimal(' not in s:
              s = s.replace('def DateEngFr(textDate):\n', 'CENTIME = Decimal("0.01")\n\ndef _montant_decimal(distance, tarif_km):\n    return (Decimal(str(distance)) * Decimal(str(tarif_km))).quantize(CENTIME, rounding=ROUND_HALF_UP)\n\ndef DateEngFr(textDate):\n', 1)
          s = s.replace('montant = float(distance) * float(tarif_km)', 'montant = _montant_decimal(distance, tarif_km)')
          s = s.replace('        montant_total = 0\n', '        montant_total = Decimal("0.00")\n', 1)
          s = s.replace('            montant = distance * tarif_km\n', '            montant = _montant_decimal(distance, tarif_km)\n')
          p.write_text(s, encoding='utf-8')

          p = Path('teamworks/Dlg/DLG_Saisie_remboursement.py')
          s = p.read_text(encoding='utf-8')
          if 'from decimal import Decimal, ROUND_HALF_UP\n' not in s:
              s = s.replace('import datetime\n', 'import datetime\nfrom decimal import Decimal, ROUND_HALF_UP\n', 1)
          if 'def _euros_decimal(' not in s:
              anchor = '_CheckboxFallback = object if _PHOENIX else CheckListCtrlMixin\n\n'
              s = s.replace(anchor, anchor + 'CENTIME = Decimal("0.01")\n\ndef _euros_decimal(value):\n    return Decimal(str(value)).quantize(CENTIME, rounding=ROUND_HALF_UP)\n\n', 1)
          old = '''        montantRattache = 0\n        for index in range(self.GetItemCount()):\n            montant = float(self.GetItem(index, 6).GetText()[:-2])\n            if self._is_checked(index):\n                montantRattache += montant\n\n        montantNonRattache = self.montantRemboursement - montantRattache\n'''
          new = '''        montantRattache = Decimal("0.00")\n        for index in range(self.GetItemCount()):\n            montant = _euros_decimal(self.GetItem(index, 6).GetText()[:-2].strip())\n            if self._is_checked(index):\n                montantRattache += montant\n\n        montantNonRattache = _euros_decimal(self.montantRemboursement) - montantRattache\n'''
          if old not in s:
              raise SystemExit('bloc rattachement float introuvable')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Add tests
        shell: bash
        run: |
          cat > tests/test_frais_decimal_money.py <<'PY'
          from decimal import Decimal
          from pathlib import Path
          import ast

          ROOT = Path(__file__).resolve().parents[1]
          IMPRESSION = ROOT / 'teamworks' / 'Dlg' / 'DLG_Impression_frais.py'
          REMBOURSEMENT = ROOT / 'teamworks' / 'Dlg' / 'DLG_Saisie_remboursement.py'

          def _function_source(path, name, class_name=None):
              text = path.read_text(encoding='utf-8')
              tree = ast.parse(text)
              if class_name is None:
                  node = next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == name)
              else:
                  cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == class_name)
                  node = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == name)
              return ast.get_source_segment(text, node)

          def test_impression_uses_decimal_for_money():
              source = IMPRESSION.read_text(encoding='utf-8')
              assert 'montant = float(distance) * float(tarif_km)' not in source
              assert 'montant_total = Decimal("0.00")' in source
              assert source.count('_montant_decimal(distance, tarif_km)') >= 2

          def test_print_money_rounding_examples():
              ns = {'Decimal': Decimal}
              helper = _function_source(IMPRESSION, '_montant_decimal')
              exec('CENTIME = Decimal("0.01")\nfrom decimal import ROUND_HALF_UP\n' + helper, ns)
              calc = ns['_montant_decimal']
              assert calc('123', '0.55') == Decimal('67.65')
              assert calc('3', '0.335') == Decimal('1.01')

          def test_reimbursement_linkage_uses_decimal():
              source = _function_source(REMBOURSEMENT, 'MajLabelRattachement', 'ListCtrl_deplacements')
              assert 'Decimal("0.00")' in source
              assert 'float(self.GetItem' not in source
              assert '_euros_decimal(self.montantRemboursement)' in source

          def test_reimbursement_decimal_normalizes_cents():
              ns = {'Decimal': Decimal}
              helper = _function_source(REMBOURSEMENT, '_euros_decimal')
              exec('CENTIME = Decimal("0.01")\nfrom decimal import ROUND_HALF_UP\n' + helper, ns)
              euros = ns['_euros_decimal']
              assert euros('0.1') + euros('0.2') == Decimal('0.30')
              assert euros('67.65000000000001') == Decimal('67.65')
          PY
      - name: Validate
        run: |
          python -m compileall -q teamworks domain application infrastructure tests
          python -m pip install -q pytest
          python -m pytest -q tests/test_frais_integrite_wx.py tests/test_frais_decimal_money.py
      - name: Commit and clean workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-frais-decimal-on-402.yml
          git add teamworks/Dlg/DLG_Impression_frais.py teamworks/Dlg/DLG_Saisie_remboursement.py tests/test_frais_decimal_money.py
          git commit -m "fix(frais): fiabiliser les montants au centime"
          git push
