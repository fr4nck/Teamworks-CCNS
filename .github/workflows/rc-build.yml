name: Construction RC Windows

on:
  push:
    branches:
      - release/vanilla-wx-0.9.2-rc1

permissions:
  contents: read

jobs:
  build-windows-rc:
    name: Construire RC Windows portable et installable
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-windows-build.txt

      - name: Installer les dépendances
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r .github/requirements-windows-build.txt
          python -m pip freeze | Set-Content build-requirements.txt

      - name: Inventorier les modules du paquet
        shell: pwsh
        run: |
          $modules = @()
          Get-ChildItem teamworks -Recurse -Filter '*.py' -File | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath((Resolve-Path teamworks).Path, $_.FullName)
            $module = [System.IO.Path]::ChangeExtension($relative, $null) -replace '[\\/]', '.'
            if ($module.EndsWith('.__init__')) { $module = $module.Substring(0, $module.Length - 9) }
            if ($module -and $module -ne '__init__') { $modules += $module }
          }
          foreach ($root in @('domain', 'application', 'infrastructure')) {
            Get-ChildItem $root -Recurse -Filter '*.py' -File | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              $module = [System.IO.Path]::ChangeExtension($relative, $null) -replace '[\\/]', '.'
              if ($module.EndsWith('.__init__')) { $module = $module.Substring(0, $module.Length - 9) }
              if ($module) { $modules += $module }
            }
          }
          $modules = $modules | Sort-Object -Unique
          if ($modules.Count -lt 250) { throw "Inventaire des modules anormalement petit : $($modules.Count)" }
          New-Item -ItemType Directory -Force build | Out-Null
          $modules | Set-Content build/internal-modules.txt

      - name: Construire l'application portable
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $modules = Get-Content build/internal-modules.txt
          $icon = (Resolve-Path 'teamworks/Static/Images/Branding/Teamworks-CCNS.ico').Path
          $args = @('-m','PyInstaller','--noconfirm','--clean','--windowed','--onedir','--name','Teamworks-CCNS','--icon',$icon,'--paths','.','--paths','teamworks','--distpath','dist','--workpath','build/pyinstaller','--specpath','build/spec','--collect-all','reportlab','--collect-all','PIL','--collect-all','mysql.connector','--hidden-import','win32com.client')
          foreach ($module in $modules) { $args += @('--hidden-import', $module) }
          $args += 'teamworks/Teamworks.py'
          python @args
          $package = 'dist/Teamworks-CCNS'
          Copy-Item teamworks/Static "$package/Static" -Recurse -Force
          if (Test-Path teamworks/Data) { Copy-Item teamworks/Data "$package/Data" -Recurse -Force }
          Copy-Item teamworks/Versions.txt "$package/Versions.txt" -Force
          Copy-Item VERSION "$package/VERSION" -Force
          Copy-Item ROADMAP.md "$package/ROADMAP.md" -Force
          Copy-Item build/internal-modules.txt "$package/INTERNAL-MODULES.txt" -Force
          Copy-Item build-requirements.txt "$package/BUILD-REQUIREMENTS.txt" -Force
          Set-Content -Path "$package/BUILD.txt" -Value "Teamworks-CCNS $version`nCommit $env:GITHUB_SHA"

      - name: Valider le contenu du paquet
        shell: pwsh
        run: |
          foreach ($required in @('Teamworks-CCNS.exe','Static','Versions.txt','VERSION','ROADMAP.md','INTERNAL-MODULES.txt','BUILD-REQUIREMENTS.txt')) {
            if (-not (Test-Path "dist/Teamworks-CCNS/$required")) { throw "$required est absent" }
          }

      - name: Tester le démarrage de l'exécutable
        shell: pwsh
        run: ./scripts/test_windows_executable.ps1

      - name: Créer l'archive portable
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = "Teamworks-CCNS-$version-windows-x64.zip"
          Compress-Archive -Path 'dist/Teamworks-CCNS/*' -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Créer l'installateur Windows
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Compilateur Inno Setup introuvable : $iscc" }
          & $iscc "/DAppVersion=$version" 'packaging/windows/Teamworks-CCNS.iss'
          if ($LASTEXITCODE -ne 0) { throw "La compilation de l'installateur a échoué avec le code $LASTEXITCODE" }
          $installer = Get-ChildItem 'dist/installer/Teamworks-CCNS-*-windows-x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw "L'installateur Windows est absent" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Add-Content SHA256SUMS.txt -Encoding ascii

      - name: Publier les artefacts RC Windows
        uses: actions/upload-artifact@v6
        with:
          name: Teamworks-CCNS-0.9.2-rc1-Windows
          path: |
            Teamworks-CCNS-0.9.2-rc1-windows-x64.zip
            dist/installer/Teamworks-CCNS-0.9.2-rc1-windows-x64-setup.exe
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
