name: Frankenstein main tabs smoke mode

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "teamworks/Teamworks.py"
      - "tools/migrate_teamworks_tabs_smoke_mode.py"
      - ".github/workflows/frankenstein-tabs-smoke-mode.yml"
  pull_request:
    branches:
      - master
    paths:
      - "teamworks/Teamworks.py"
      - "tools/migrate_teamworks_tabs_smoke_mode.py"
      - ".github/workflows/frankenstein-tabs-smoke-mode.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply main-tabs smoke mode
        run: python tools/migrate_teamworks_tabs_smoke_mode.py

      - name: Compile migrated entry point
        run: python -m py_compile teamworks/Teamworks.py

      - name: Verify migration is idempotent
        run: python tools/migrate_teamworks_tabs_smoke_mode.py

      - name: Commit migration result
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- teamworks/Teamworks.py; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Teamworks.py
          git commit -m "Frankenstein lot 2 — activer le smoke des onglets principaux"
          git pull --rebase origin "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push
