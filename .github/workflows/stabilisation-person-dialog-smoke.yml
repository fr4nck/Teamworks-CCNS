name: Stabilisation person dialog smoke

on:
  pull_request:
    branches:
      - master
      - stabilisation/recette-fonctionnelle-secondaire
    paths:
      - "tools/smoke_runtime.py"
      - "tools/smoke_secondary_person_dialog.py"
      - "teamworks/Dlg/DLG_Fiche_individuelle.py"
      - "teamworks/Ctrl/CTRL_Page_*.py"
      - "teamworks/GestionDB.py"
      - "tests/test_secondary_person_smoke_contract.py"
      - ".github/workflows/stabilisation-person-dialog-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-person-dialog:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/python311-core.txt

      - name: Build and exercise person dialog
        id: person_smoke
        continue-on-error: true
        shell: pwsh
        run: python tools/smoke_secondary_person_dialog.py

      - name: Upload person-dialog diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: person-dialog-smoke-diagnostic
          path: artifacts/person-dialog-smoke/diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Ensure temporary entry point was removed
        if: always()
        shell: pwsh
        run: |
          if (Test-Path teamworks/Teamworks_secondary_person_smoke.py) {
            throw "Le point d'entrée temporaire n'a pas été supprimé"
          }

      - name: Fail when person dialog smoke failed
        if: always() && steps.person_smoke.outcome == 'failure'
        shell: pwsh
        run: throw "Le smoke de la fiche individuelle a échoué."

  expose-person-diagnostic:
    needs: smoke-person-dialog
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download diagnostic
        uses: actions/download-artifact@v4
        with:
          name: person-dialog-smoke-diagnostic
          path: diagnostic

      - name: Display complete diagnostic
        shell: bash
        run: |
          echo "===== PERSON_DIALOG_DIAGNOSTIC ====="
          cat diagnostic/diagnostic.txt
          echo "===== END_PERSON_DIALOG_DIAGNOSTIC ====="

      - name: Propagate smoke failure
        if: needs.smoke-person-dialog.result != 'success'
        run: exit 1
