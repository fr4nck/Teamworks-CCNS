name: Stabilisation contract dialog smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - "tools/smoke_secondary_contract_dialog.py"
      - "teamworks/Dlg/DLG_Creation_contrat.py"
      - "teamworks/Ctrl/CTRL_Creation_contrat_p*.py"
      - ".github/workflows/stabilisation-contract-dialog-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-contract-dialog:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/python311-core.txt

      - name: Build and exercise contract dialog
        id: contract_smoke
        continue-on-error: true
        shell: pwsh
        run: python tools/smoke_secondary_contract_dialog.py

      - name: Upload contract-dialog diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-dialog-smoke-diagnostic
          path: artifacts/contract-dialog-smoke/diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Ensure temporary entry point was removed
        if: always()
        shell: pwsh
        run: |
          if (Test-Path teamworks/Teamworks_secondary_contract_smoke.py) {
            throw "Le point d'entrée temporaire n'a pas été supprimé"
          }

      - name: Fail when contract dialog smoke failed
        if: always() && steps.contract_smoke.outcome == 'failure'
        shell: pwsh
        run: throw "Le smoke du contrat a échoué."
