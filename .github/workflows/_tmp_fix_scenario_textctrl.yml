name: Correctif temporaire champs Scénarios

on:
  push:
    branches:
      - uat-scenarios-lifecycle-clean-2026-08-25

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v6
        with:
          ref: uat-scenarios-lifecycle-clean-2026-08-25
          fetch-depth: 0

      - name: Appliquer le correctif TextCtrl vérifié
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('teamworks/Dlg/DLG_Scenario.py')
          raw = path.read_bytes()

          def blob_sha(data: bytes) -> str:
              header = b'blob ' + str(len(data)).encode('ascii') + b'\0'
              return hashlib.sha1(header + data).hexdigest()

          before = blob_sha(raw)
          expected_before = '9065a4bf603cd2da91dd20a99a6b35c53c761db2'
          if before != expected_before:
              raise RuntimeError(f'DLG_Scenario.py inattendu avant patch: {before} != {expected_before}')

          source = raw.decode('utf-8')
          replacements = (
              ('            self.ctrl_nom.SetLabel(nom)', '            self.ctrl_nom.SetValue(nom)'),
              ('            self.ctrl_description.SetLabel(str(description))', '            self.ctrl_description.SetValue(str(description))'),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError(f'Expression attendue une fois: {old!r}; trouvée {source.count(old)} fois')
              source = source.replace(old, new, 1)

          compile(source, str(path), 'exec')
          path.write_text(source, encoding='utf-8', newline='')

          after = blob_sha(path.read_bytes())
          expected_after = 'e4a0802eb734c1c553858c90579f14397f2903ca'
          if after != expected_after:
              raise RuntimeError(f'DLG_Scenario.py inattendu après patch: {after} != {expected_after}')

          print(f'Correctif TextCtrl Scénarios validé: {before} -> {after}')
          PY

          python -m py_compile teamworks/Dlg/DLG_Scenario.py
          git diff --check

      - name: Retirer ce workflow et publier le correctif
        shell: bash
        run: |
          rm .github/workflows/_tmp_fix_scenario_textctrl.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Scenario.py .github/workflows/_tmp_fix_scenario_textctrl.yml
          git diff --cached --check
          git commit -m "Scénarios: charger les champs texte avec SetValue sous Phoenix"
          git push origin HEAD:uat-scenarios-lifecycle-clean-2026-08-25
