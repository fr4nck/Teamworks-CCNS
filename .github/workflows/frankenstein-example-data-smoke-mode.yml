name: Frankenstein example data smoke mode

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "teamworks/Teamworks.py"
      - "tools/migrate_teamworks_example_data_smoke_mode.py"
      - ".github/workflows/frankenstein-example-data-smoke-mode.yml"
  pull_request:
    branches:
      - master
    paths:
      - "teamworks/Teamworks.py"
      - "tools/migrate_teamworks_example_data_smoke_mode.py"
      - ".github/workflows/frankenstein-example-data-smoke-mode.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply example-data smoke mode
        run: python tools/migrate_teamworks_example_data_smoke_mode.py

      - name: Compile migrated entry point
        run: python -m py_compile teamworks/Teamworks.py

      - name: Verify example-data markers
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("teamworks/Teamworks.py").read_text(encoding="utf-8")
          assert source.count("TEAMWORKS_SMOKE_EXAMPLE_READY") == 1
          assert 'frame.OuvrirFichier("Exemple")' in source
          assert 'Exemples/Exemple_{suffix}.dat' in source
          PY

      - name: Commit migration result
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- teamworks/Teamworks.py; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Teamworks.py
          git commit -m "Frankenstein lot 2 — ouvrir les données d'exemple dans le smoke"
          git push
