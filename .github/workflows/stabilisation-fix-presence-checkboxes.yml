name: Stabilisation fix presence checkboxes

on:
  pull_request:
    branches:
      - master
    paths:
      - "tools/fix_presence_checkboxes.py"
      - ".github/workflows/stabilisation-fix-presence-checkboxes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilisation branch
        uses: actions/checkout@v4
        with:
          ref: stabilisation/recette-fonctionnelle-secondaire

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply idempotent correction
        run: python tools/fix_presence_checkboxes.py

      - name: Verify Phoenix checkbox activation
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('teamworks/Ctrl/CTRL_Presences.py'),
              Path('teamworks/Dlg/DLG_Saisie_presence.py'),
          )
          marker = "if 'phoenix' in wx.PlatformInfo:\n            self.EnableCheckBoxes(True)"
          for path in paths:
              source = path.read_text(encoding='iso-8859-15')
              assert source.count(marker) == 1, path
              compile(source, str(path), 'exec')
          PY

      - name: Commit corrected controls
        shell: bash
        run: |
          if git diff --quiet -- teamworks/Ctrl/CTRL_Presences.py teamworks/Dlg/DLG_Saisie_presence.py; then
            echo "Presence checkboxes already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_Presences.py teamworks/Dlg/DLG_Saisie_presence.py
          git commit -m "Stabilisation — activer les cases à cocher des présences sous Phoenix"
          git push origin HEAD:stabilisation/recette-fonctionnelle-secondaire
