name: Complete PR423 parameter defaults retry
on: [push]
permissions:
  contents: write
jobs:
  patch_and_test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch and create regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '        DB = GestionDB.DB(nomDB="Defaut.db3")\n'
          new = ('        DB = GestionDB.DB(\n'
                 '            nomFichier=Chemins.GetStaticPath("Databases/Defaut.dat"),\n'
                 '            suffixe=None,\n'
                 '        )\n')
          for path in ('teamworks/Dlg/DLG_Parametres_dossiers.py', 'teamworks/Dlg/DLG_Parametres_calendrier.py'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit('%s: legacy call count is %d' % (path, text.count(old)))
              p.write_text(text.replace(old, new), encoding='utf-8')
          test = Path('tests/test_parametres_defaults_db_rc1.py')
          test.write_text("""# -*- coding: utf-8 -*-
          import ast
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          FILES = (
              'teamworks/Dlg/DLG_Parametres_horloge.py',
              'teamworks/Dlg/DLG_Parametres_dossiers.py',
              'teamworks/Dlg/DLG_Parametres_calendrier.py',
          )

          def _on_left_link(path):
              text = (ROOT / path).read_text(encoding='utf-8')
              tree = ast.parse(text)
              cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'Dialog')
              func = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == 'OnLeftLink')
              lines = text.splitlines()
              return '\\n'.join(lines[func.lineno - 1:func.end_lineno])

          def test_three_parameter_screens_use_supported_defaults_database_api():
              for path in FILES:
                  body = _on_left_link(path)
                  assert 'nomDB="Defaut.db3"' not in body
                  assert 'nomFichier=Chemins.GetStaticPath("Databases/Defaut.dat")' in body
                  assert 'suffixe=None' in body

          def test_three_parameter_screens_keep_same_constructor_shape():
              marker = 'DB = GestionDB.DB(\\n            nomFichier=Chemins.GetStaticPath("Databases/Defaut.dat"),\\n            suffixe=None,\\n        )'
              for path in FILES:
                  assert marker in _on_left_link(path)
          """.replace('\n          ', '\n').lstrip(), encoding='utf-8')
          PY
      - name: Compile
        run: python -m compileall -q teamworks/Dlg/DLG_Parametres_horloge.py teamworks/Dlg/DLG_Parametres_dossiers.py teamworks/Dlg/DLG_Parametres_calendrier.py tests/test_parametres_defaults_db_rc1.py
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Test
        run: python -m pytest -q tests/test_parametres_defaults_db_rc1.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Parametres_dossiers.py teamworks/Dlg/DLG_Parametres_calendrier.py tests/test_parametres_defaults_db_rc1.py
          git commit -m "fix: aligner les trois parametres sur Defaut.dat"
          git push origin HEAD:fix/rc1-recette-bugs-20260908
