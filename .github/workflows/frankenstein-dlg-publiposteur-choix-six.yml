name: Frankenstein DLG_Publiposteur_Choix six migration

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_dlg_publiposteur_choix_six.py"
      - "tests/test_migrate_dlg_publiposteur_choix_six.py"
      - ".github/workflows/frankenstein-dlg-publiposteur-choix-six.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run migrator tests
        run: python -m pytest -q tests/test_migrate_dlg_publiposteur_choix_six.py

      - name: Apply migration
        run: python tools/migrate_dlg_publiposteur_choix_six.py --write

      - name: Verify migration
        run: python tools/migrate_dlg_publiposteur_choix_six.py --check

      - name: Compile migrated source
        run: python -m py_compile teamworks/Dlg/DLG_Publiposteur_Choix.py

      - name: Commit migrated source
        run: |
          if git diff --quiet -- teamworks/Dlg/DLG_Publiposteur_Choix.py; then
            echo "No migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Publiposteur_Choix.py
          git commit -m "Frankenstein lot 2 — retirer six du choix publiposteur"
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
