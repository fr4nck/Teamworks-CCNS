name: Stabilisation presence dialog smoke

on:
  push:
    branches:
      - stabilisation/recette-fonctionnelle-secondaire
    paths:
      - "tools/smoke_secondary_presence_dialog.py"
      - "teamworks/Dlg/DLG_Saisie_presence.py"
      - "teamworks/GestionDB.py"
      - "tests/test_gestiondb_default_filename.py"
      - ".github/workflows/stabilisation-presence-dialog-smoke.yml"
  pull_request:
    branches:
      - master
    paths:
      - "tools/smoke_secondary_presence_dialog.py"
      - "teamworks/Dlg/DLG_Saisie_presence.py"
      - "teamworks/GestionDB.py"
      - "tests/test_gestiondb_default_filename.py"
      - ".github/workflows/stabilisation-presence-dialog-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-presence-dialog:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet -r requirements/python311-core.txt

      - name: Build and exercise presence dialog
        id: presence_smoke
        continue-on-error: true
        shell: pwsh
        run: python tools/smoke_secondary_presence_dialog.py

      - name: Upload presence-dialog diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presence-dialog-smoke-diagnostic
          path: artifacts/presence-dialog-smoke/diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Ensure temporary entry point was removed
        if: always()
        shell: pwsh
        run: |
          if (Test-Path teamworks/Teamworks_secondary_presence_smoke.py) {
            throw "Le point d'entrée temporaire n'a pas été supprimé"
          }

      - name: Fail when presence dialog smoke failed
        if: always() && steps.presence_smoke.outcome == 'failure'
        shell: pwsh
        run: throw "Le smoke du formulaire de présence a échoué."

  expose-presence-diagnostic:
    needs: smoke-presence-dialog
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download diagnostic
        uses: actions/download-artifact@v4
        with:
          name: presence-dialog-smoke-diagnostic
          path: diagnostic

      - name: Display complete diagnostic
        shell: bash
        run: |
          echo "===== PRESENCE_DIALOG_DIAGNOSTIC ====="
          cat diagnostic/diagnostic.txt
          echo "===== END_PRESENCE_DIALOG_DIAGNOSTIC ====="

      - name: Propagate smoke failure
        if: needs.smoke-presence-dialog.result != 'success'
        run: exit 1
