name: Stabilisation backup restore smoke

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/smoke_backup_restore.py"
      - "teamworks/Utils/UTILS_Sauvegarde.py"
      - "teamworks/Static/Exemples/*.dat"
      - ".github/workflows/stabilisation-backup-restore-smoke.yml"
  workflow_dispatch:

jobs:
  backup-restore:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/python311-core.txt

      - name: Exercise real backup and restore utilities
        id: backup_restore
        continue-on-error: true
        shell: pwsh
        run: python tools/smoke_backup_restore.py

      - name: Upload backup restore diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-smoke-diagnostic
          path: artifacts/backup-restore-smoke/diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Fail when backup restore smoke failed
        if: always() && steps.backup_restore.outcome == 'failure'
        shell: pwsh
        run: throw "La recette sauvegarde/restauration a échoué."
