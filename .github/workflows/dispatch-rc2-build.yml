name: Déclencheur build RC2 de correction

on:
  push:
    branches:
      - fix/vanilla-wx-0.9.2-rc2-c-f
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-rc2-build:
    name: Déclencher le pipeline RC2 complet
    runs-on: ubuntu-24.04
    steps:
      - name: Lancer ci.yml avec build_windows=true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run ci.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF_NAME"
          -f build_windows=true
