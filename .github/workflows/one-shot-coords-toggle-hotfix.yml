name: One-shot coords ToggleButton hotfix

on:
  push:
    branches:
      - fix/coords-toggle-hotfix
    paths:
      - .github/workflows/one-shot-coords-toggle-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/coords-toggle-hotfix
          fetch-depth: 0

      - name: Apply ToggleButton hotfix
        run: python scripts/apply_coords_toggle_hotfix.py

      - name: Compile patched dialog
        run: python -m py_compile teamworks/Dlg/DLG_Saisie_coords.py

      - name: Guard category event bindings
        shell: bash
        run: |
          test "$(grep -c 'EVT_TOGGLEBUTTON, self.OnBouton_' teamworks/Dlg/DLG_Saisie_coords.py)" -eq 4
          ! grep -q 'EVT_BUTTON, self.OnBouton_Fixe, self.bouton_fixe' teamworks/Dlg/DLG_Saisie_coords.py

      - name: Commit one-shot hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Saisie_coords.py
          git rm scripts/apply_coords_toggle_hotfix.py .github/workflows/one-shot-coords-toggle-hotfix.yml
          git commit -m "Hotfix: réactiver la saisie des coordonnées"
          git push origin HEAD:fix/coords-toggle-hotfix
