name: Frankenstein mutable defaults audit

on:
  pull_request:
    paths:
      - 'teamworks/**/*.py'
      - 'tools/find_mutable_defaults.py'
      - '.github/workflows/frankenstein-mutable-defaults-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify mutable defaults inventory
        run: |
          python tools/find_mutable_defaults.py teamworks > mutable-defaults.txt
          cat mutable-defaults.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mutable-defaults
          path: mutable-defaults.txt
