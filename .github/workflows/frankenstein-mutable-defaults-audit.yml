name: Frankenstein mutable defaults audit

on:
  pull_request:
    paths:
      - 'teamworks/**/*.py'
      - 'tools/find_mutable_defaults.py'
      - 'tools/rewrite_mutable_defaults.py'
      - '.github/workflows/frankenstein-mutable-defaults-audit.yml'

permissions:
  contents: write

jobs:
  audit-and-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory mutable defaults before cleanup
        run: python tools/find_mutable_defaults.py teamworks > mutable-defaults-before.txt
      - name: Rewrite safe utility batch
        run: |
          python tools/rewrite_mutable_defaults.py \
            teamworks/Utils/UTILS_Divers.py \
            teamworks/Utils/UTILS_Envoi_email.py \
            teamworks/Utils/UTILS_Excel.py \
            teamworks/Utils/UTILS_Json.py \
            teamworks/Utils/UTILS_Parametres.py \
            teamworks/Utils/UTILS_Publipostage_donnees.py
      - name: Compile cleaned utility modules
        run: |
          python -m py_compile \
            teamworks/Utils/UTILS_Divers.py \
            teamworks/Utils/UTILS_Envoi_email.py \
            teamworks/Utils/UTILS_Excel.py \
            teamworks/Utils/UTILS_Json.py \
            teamworks/Utils/UTILS_Parametres.py \
            teamworks/Utils/UTILS_Publipostage_donnees.py
      - name: Inventory mutable defaults after cleanup
        run: python tools/find_mutable_defaults.py teamworks > mutable-defaults-after.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mutable-defaults
          path: |
            mutable-defaults-before.txt
            mutable-defaults-after.txt
      - name: Commit safe utility cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Utils
          git commit -m "refactor: sécuriser les paramètres mutables des utilitaires"
          git push origin HEAD:${{ github.head_ref }}
