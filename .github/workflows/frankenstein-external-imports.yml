name: Frankenstein external imports inventory

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "teamworks/**/*.py"
      - "tools/inventory_external_imports.py"
      - ".github/workflows/frankenstein-external-imports.yml"
  pull_request:
    branches:
      - master
    paths:
      - "teamworks/**/*.py"
      - "tools/inventory_external_imports.py"
      - ".github/workflows/frankenstein-external-imports.yml"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inventory external imports
        run: |
          python tools/inventory_external_imports.py --path teamworks \
            --json external-imports.json \
            --markdown external-imports.md
          cat external-imports.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload external import inventory
        uses: actions/upload-artifact@v4
        with:
          name: external-imports
          path: |
            external-imports.json
            external-imports.md
          if-no-files-found: error

      - name: Compile inventory tool
        run: python -m py_compile tools/inventory_external_imports.py
