name: Frankenstein clean thumbnailctrl Phoenix fallbacks

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_thumbnailctrl_phoenix.py"
      - ".github/workflows/frankenstein-thumbnailctrl-phoenix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove thumbnailctrl Classic fallbacks
        run: python tools/migrate_thumbnailctrl_phoenix.py --write

      - name: Verify migration idempotence
        run: python tools/migrate_thumbnailctrl_phoenix.py --check

      - name: Compile migrated source
        run: python -m compileall -q teamworks/Ctrl/CTRL_thumbnailctrl.py

      - name: Commit migrated source
        run: |
          if git diff --quiet -- teamworks/Ctrl/CTRL_thumbnailctrl.py; then
            echo "No thumbnailctrl migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_thumbnailctrl.py
          git commit -m "Frankenstein lot 2 — nettoyer thumbnailctrl pour Phoenix"
          git pull --rebase origin frankenstein/python3-wxphoenix-lot2
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
