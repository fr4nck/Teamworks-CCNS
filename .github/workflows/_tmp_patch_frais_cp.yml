name: Patch temporaire codes postaux frais

on:
  push:
    branches:
      - fix/0.9.2-frais-integrite-moteur

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.9.2-frais-integrite-moteur
      - name: Preserver les codes postaux
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("teamworks/Dlg/DLG_Saisie_deplacement.py"); s=p.read_text(encoding="utf-8"); s=s.replace("cp_depart = int(self.ctrl_cp_depart.GetValue())", "cp_depart = self.ctrl_cp_depart.GetValue()", 1); s=s.replace("cp_arrivee = int(self.ctrl_cp_arrivee.GetValue())", "cp_arrivee = self.ctrl_cp_arrivee.GetValue()", 1); p.write_text(s, encoding="utf-8", newline="\n")'
      - name: Verifier compilation
        shell: bash
        run: python -m py_compile teamworks/Dlg/DLG_Saisie_deplacement.py
      - name: Committer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teamworks/Dlg/DLG_Saisie_deplacement.py
          git commit -m 'fix: preserver les codes postaux du cache distances'
          git push origin HEAD:fix/0.9.2-frais-integrite-moteur
