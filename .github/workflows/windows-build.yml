name: Windows executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'teamworks/**'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'
      - 'scripts/build_windows.ps1'
      - 'scripts/test_windows_executable.ps1'
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Teamworks-CCNS
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Validate executable output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Teamworks-CCNS/Teamworks-CCNS.exe')) {
            throw 'Executable Teamworks-CCNS.exe absent du dossier dist.'
          }

      - name: Smoke test Windows executable
        shell: pwsh
        run: ./scripts/test_windows_executable.ps1

      - name: Upload smoke-test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Teamworks-CCNS-Windows-smoke-logs
          path: |
            teamworks-smoke.stdout.log
            teamworks-smoke.stderr.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Teamworks-CCNS/*' -DestinationPath 'Teamworks-CCNS-Windows-portable.zip' -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Teamworks-CCNS-Windows-portable
          path: Teamworks-CCNS-Windows-portable.zip
          if-no-files-found: error
          retention-days: 14
