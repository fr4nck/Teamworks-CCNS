name: Frankenstein GestionDB CreationTable repair

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "teamworks/GestionDB.py"
      - "tools/migrate_gestiondb_creation_table.py"
      - ".github/workflows/frankenstein-gdb-creation-table.yml"
  pull_request:
    branches:
      - master
    paths:
      - "teamworks/GestionDB.py"
      - "tools/migrate_gestiondb_creation_table.py"
      - ".github/workflows/frankenstein-gdb-creation-table.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Repair or verify CreationTable
        run: python tools/migrate_gestiondb_creation_table.py

      - name: Compile repaired module
        run: python -m py_compile teamworks/GestionDB.py

      - name: Verify migration is idempotent
        run: python tools/migrate_gestiondb_creation_table.py

      - name: Commit migration result
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- teamworks/GestionDB.py; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/GestionDB.py
          git commit -m "Frankenstein lot 2 — restaurer CreationTable"
          git push
