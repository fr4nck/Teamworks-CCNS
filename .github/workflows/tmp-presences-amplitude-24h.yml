name: tmp-presences-amplitude-24h
on:
  push:
    branches:
      - fix/0.9.2-presences-moteur
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/0.9.2-presences-moteur
      - name: Corriger l’amplitude horaire
        shell: python
        run: |
          from pathlib import Path
          p = Path('teamworks/Dlg/DLG_Saisie_heures.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('0<= int(texteBrut[:2]) <=24', '0<= int(texteBrut[:2]) <=23')
          s = s.replace('heureDebut > "24:00"', 'heureDebut >= "24:00"')
          s = s.replace('heureFin > "24:00"', 'heureFin >= "24:00"')
          p.write_text(s, encoding='utf-8')
      - name: Étendre les tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_presences_motor_integrity.py')
          s = p.read_text(encoding='utf-8')
          header = "AMPLITUDE_PATH = ROOT / 'teamworks' / 'Dlg' / 'DLG_Saisie_heures.py'\nAMPLITUDE_SOURCE = AMPLITUDE_PATH.read_text(encoding='utf-8')\n"
          if 'AMPLITUDE_PATH' not in s:
              s = s.replace("TREE = ast.parse(SOURCE)\n", "TREE = ast.parse(SOURCE)\n" + header)
          extra = '''\n\ndef test_planning_amplitude_never_accepts_hour_24_before_datetime_time():\n    assert '0<= int(texteBrut[:2]) <=24' not in AMPLITUDE_SOURCE\n    assert AMPLITUDE_SOURCE.count('0<= int(texteBrut[:2]) <=23') == 2\n    assert 'heureDebut >= "24:00"' in AMPLITUDE_SOURCE\n    assert 'heureFin >= "24:00"' in AMPLITUDE_SOURCE\n    assert 'datetime.time(int(heureTuple[0]), int(heureTuple[1]))' in AMPLITUDE_SOURCE\n'''
          if 'test_planning_amplitude_never_accepts_hour_24_before_datetime_time' not in s:
              s += extra
          p.write_text(s, encoding='utf-8')
      - name: Valider
        run: |
          python -m compileall -q teamworks tests
          python -m pip install -q pytest
          python -m pytest -q tests/test_presences_motor_integrity.py
      - name: Committer et nettoyer
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-presences-amplitude-24h.yml
          git add teamworks/Dlg/DLG_Saisie_heures.py tests/test_presences_motor_integrity.py
          git commit -m "fix(presences): refuser 24h00 dans l’amplitude planning"
          git push
