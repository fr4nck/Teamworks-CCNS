name: Frankenstein six.PY2 decode batch

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_six_py2_decode_branches.py"
      - ".github/workflows/frankenstein-six-py2-decode-batch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove Python 2-only decode branches
        run: python tools/migrate_six_py2_decode_branches.py --write --path teamworks

      - name: Verify decode migration
        run: python tools/migrate_six_py2_decode_branches.py --check --path teamworks

      - name: Commit migrated sources
        run: |
          if git diff --quiet -- teamworks; then
            echo "No migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks
          git commit -m "Frankenstein lot 2 — supprimer les décodages six.PY2 morts"
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
