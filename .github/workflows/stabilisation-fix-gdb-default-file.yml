name: Stabilisation fix GestionDB default file

on:
  push:
    branches:
      - stabilisation/recette-fonctionnelle-secondaire
    paths:
      - "tools/fix_gestiondb_default_filename.py"
      - ".github/workflows/stabilisation-fix-gdb-default-file.yml"
  pull_request:
    branches:
      - master
    paths:
      - "tools/fix_gestiondb_default_filename.py"
      - ".github/workflows/stabilisation-fix-gdb-default-file.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilisation/recette-fonctionnelle-secondaire

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore current database resolution
        run: python tools/fix_gestiondb_default_filename.py

      - name: Verify restored behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('teamworks/GestionDB.py')
          source = path.read_text(encoding='iso-8859-15')
          block = 'if self.nomFichier == "":\n            self.nomFichier = self.GetNomFichierDefaut()'
          assert source.count(block) == 1
          assert source.index(block) < source.index('if MODE_TEAMWORKS == True')
          compile(source, str(path), 'exec')
          PY

      - name: Commit application correction
        shell: bash
        run: |
          if git diff --quiet -- teamworks/GestionDB.py; then
            echo "GestionDB already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/GestionDB.py
          git commit -m "Stabilisation — restaurer le fichier courant dans GestionDB.DB"
          git push origin HEAD:stabilisation/recette-fonctionnelle-secondaire
