name: Frankenstein migrate six.PY3 constants

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_six_py3_constants.py"
      - ".github/workflows/frankenstein-six-py3-constants.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Replace six.PY3 constants
        run: python tools/migrate_six_py3_constants.py --write --path teamworks

      - name: Verify migration idempotence
        run: python tools/migrate_six_py3_constants.py --check --path teamworks

      - name: Verify six runtime branch lock
        run: python -m pytest -q tests/test_no_python2_builtin_names.py::test_python2_and_python3_six_runtime_branches_are_gone

      - name: Compile migrated sources
        run: python -m compileall -q teamworks
        continue-on-error: true

      - name: Commit migrated sources
        run: |
          if git diff --quiet -- teamworks; then
            echo "No six.PY3 migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks
          git commit -m "Frankenstein lot 2 — retirer les constantes six.PY3 restantes"
          git pull --rebase origin frankenstein/python3-wxphoenix-lot2
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
