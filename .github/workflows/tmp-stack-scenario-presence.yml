name: tmp-stack-scenario-presence
on:
  push:
    branches:
      - test/0.9.2-scenario-stacked
permissions:
  contents: write
jobs:
  stack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/0.9.2-scenario-stacked
      - name: Install test dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Apply presence fix on atomic scenario base
        shell: python
        run: |
          from pathlib import Path
          path = Path('teamworks/Dlg/DLG_Scenario.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from Utils.UTILS_ScenarioReports import ProtegerReportContreCycles\n'
          if 'from Utils.UTILS_Duration import duree_presence_wx\n' not in text:
              text = text.replace(anchor, anchor + 'from Utils.UTILS_Duration import duree_presence_wx\n', 1)
          old = '            duree = self.OperationHeures("+" + heure_fin, "+" + heure_debut, "soustraction")\n'
          new = '''            duree, resultat_presence = duree_presence_wx(heure_debut, heure_fin)\n            if not resultat_presence.ok:\n                erreur = resultat_presence.error\n                dictHeuresRealisees["total_heures_realisees"] = "ERREUR"\n                dictHeuresRealisees["erreur_presence"] = {\n                    "IDpresence": IDpresence,\n                    "code": erreur.code if erreur is not None else "INVALID_PRESENCE",\n                    "message": erreur.message if erreur is not None else "Présence invalide.",\n                    "field": erreur.field if erreur is not None else "horaire",\n                }\n                return dictHeuresRealisees, listeLabelsDetails\n'''
          if text.count(old) != 2:
              raise SystemExit(f'anciens calculs trouvés: {text.count(old)} au lieu de 2')
          text = text.replace(old, new)
          guard_anchor = '        total_heures_realisees = dictHeuresRealisees["total_heures_realisees"]\n'
          guard = '''        total_heures_realisees = dictHeuresRealisees["total_heures_realisees"]\n        if dictHeuresRealisees.get("erreur_presence") is not None:\n            dictDonnees["total_heures_realisees"] = "ERREUR"\n            dictDonnees["listeLabelsDetails"] = []\n            dictDonnees["erreur_presence"] = dictHeuresRealisees["erreur_presence"]\n            dictDonnees["total_reste_heures"] = "ERREUR"\n            return dictDonnees\n'''
          if text.count(guard_anchor) != 2:
              raise SystemExit(f'appels réalisés trouvés: {text.count(guard_anchor)} au lieu de 2')
          path.write_text(text.replace(guard_anchor, guard), encoding='utf-8')
      - name: Add numeric presence tests
        shell: bash
        run: |
          cat > tests/test_scenario_presence_duration_contract.py <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          SCENARIO = ROOT / "teamworks" / "Dlg" / "DLG_Scenario.py"
          DURATION = ROOT / "teamworks" / "Utils" / "UTILS_Duration.py"
          sys.path.insert(0, str(ROOT / "teamworks"))
          from Utils.UTILS_Duration import duree_presence_wx

          def _source(path):
              return path.read_text(encoding="utf-8")

          def test_scenario_presence_uses_clock_time_adapter_in_both_paths():
              source = _source(SCENARIO)
              assert "from Utils.UTILS_Duration import duree_presence_wx" in source
              assert source.count("duree_presence_wx(heure_debut, heure_fin") == 2
              assert 'OperationHeures("+" + heure_fin' not in source

          def test_presence_adapter_keeps_raw_difference_without_implicit_overnight():
              source = _source(DURATION)
              assert "allow_overnight=False" in source
              assert "calculate_time_difference(" in source

          def test_presence_positive_duration():
              value, result = duree_presence_wx("08:00", "12:00")
              assert result.ok and result.value_minutes == 240 and value == "+4:00"

          def test_presence_negative_duration_is_valid():
              value, result = duree_presence_wx("09:00", "08:30")
              assert result.ok and result.value_minutes == -30 and value == "-0:30"

          def test_presence_equal_times_is_zero_not_twenty_four_hours():
              value, result = duree_presence_wx("08:00", "08:00")
              assert result.ok and result.value_minutes == 0 and value == "+0:00"

          def test_presence_does_not_infer_overnight():
              value, result = duree_presence_wx("22:00", "02:00")
              assert result.ok and result.value_minutes == -1200 and value == "-20:00"

          def test_presence_invalid_values_are_structured_errors():
              for start, end, code in [
                  (None, "12:00", "MISSING_TIME"),
                  ("8h30", "12:00", "INVALID_TIME_FORMAT"),
                  ("08:00", "24:00", "INVALID_TIME_VALUE"),
              ]:
                  value, result = duree_presence_wx(start, end)
                  assert value is None
                  assert result.ok is False
                  assert result.error is not None
                  assert result.error.code == code
          PY
      - name: Run stacked scenario tests
        run: |
          python -m compileall -q teamworks domain application infrastructure tests
          python -m pytest -q tests/test_scenario_transactions.py tests/test_scenario_presence_duration_contract.py
      - name: Commit stacked integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add teamworks/Dlg/DLG_Scenario.py tests/test_scenario_presence_duration_contract.py
          git commit -m "test(scenario): valider présence au-dessus de l'atomicité"
          git push
