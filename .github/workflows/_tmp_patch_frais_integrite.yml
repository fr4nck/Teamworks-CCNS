name: Patch temporaire integrite frais

on:
  push:
    branches:
      - fix/0.9.2-frais-integrite-moteur

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.9.2-frais-integrite-moteur
      - name: Supprimer ecriture parasite gadgets
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("teamworks/Dlg/DLG_Impression_frais.py"); s=p.read_text(encoding="utf-8"); a=s.index("    def OnCheckItem(self, index, flag):"); b=s.index("    def Importation(self):", a); n="    def OnCheckItem(self, index, flag):\n        \"\"\"La coche sert uniquement a selectionner les deplacements a imprimer.\"\"\"\n        # Aucun etat metier nest persiste ici : la ligne porte un IDdeplacement.\n        pass\n\n"; p.write_text(s[:a]+n+s[b:], encoding="utf-8", newline="\n")'
      - name: Verifier correctif
        shell: bash
        run: |
          python -m py_compile teamworks/Dlg/DLG_Impression_frais.py
          python -m pytest -q tests/test_frais_print_selection_integrity.py
      - name: Committer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teamworks/Dlg/DLG_Impression_frais.py
          git commit -m 'fix: ne plus modifier gadgets lors de la selection frais'
          git push origin HEAD:fix/0.9.2-frais-integrite-moteur
