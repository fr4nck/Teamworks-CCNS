name: Patch temporaire atomicité scénario

on:
  push:
    branches:
      - fix/0.9.2-scenario-atomicity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.9.2-scenario-atomicity
      - name: Raccorder la sauvegarde scénario
        shell: python
        run: |
          from pathlib import Path

          path = Path("teamworks/Dlg/DLG_Scenario.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from Utils.UTILS_ScenarioReports import ProtegerReportContreCycles\n"
          import_line = "from Utils.UTILS_ScenarioTransactions import sauvegarder_scenario_atomique\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("ancre import introuvable")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          save_start = text.index("    def Sauvegarde(self):\n")
          save_end = text.index("    def OnBoutonExcel(self, event):\n", save_start)
          new_save = '''    def Sauvegarde(self):
        DB = GestionDB.DB()

        IDpersonne = self.GetIDpersonne()
        nom = self.ctrl_nom.GetValue()
        description = self.ctrl_description.GetValue()
        mode_heure = self.ctrl_modeHeure.GetSelection()
        detail_mois = self.ctrl_detail.GetSelection()
        date_debut, date_fin = self.GetDatesPeriode()
        toutes_categories = int(self.ctrl_toutes_categories.GetValue())

        listeDonnees = [
            ("IDpersonne", IDpersonne),
            ("nom", nom),
            ("description", description),
            ("mode_heure", mode_heure),
            ("detail_mois", detail_mois),
            ("date_debut", str(date_debut)),
            ("date_fin", str(date_fin)),
            ("toutes_categories", toutes_categories),
        ]

        try:
            IDscenario = sauvegarder_scenario_atomique(
                DB,
                self.IDscenario,
                listeDonnees,
                self.ctrl_tableau.dictVirtualDB,
            )
        finally:
            DB.Close()

        return IDscenario

'''
          text = text[:save_start] + new_save + text[save_end:]

          old_call = "        # Sauvegarde\n        IDscenario = self.Sauvegarde()\n"
          new_call = '''        # Sauvegarde atomique : une erreur ne doit jamais fermer le dialogue
        # ni laisser un scénario partiellement enregistré.
        try:
            IDscenario = self.Sauvegarde()
        except Exception as err:
            dlg = wx.MessageDialog(
                self,
                _(u"La sauvegarde du scénario a échoué. Aucune modification n'a été conservée.\\n\\n%s") % six.text_type(err),
                _(u"Erreur de sauvegarde"),
                wx.OK | wx.ICON_ERROR,
            )
            dlg.ShowModal()
            dlg.Destroy()
            return
'''
          if old_call not in text:
              raise SystemExit("appel Sauvegarde historique introuvable")
          text = text.replace(old_call, new_call, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Vérifier le patch
        shell: bash
        run: |
          python -m py_compile teamworks/Dlg/DLG_Scenario.py
          grep -q 'sauvegarder_scenario_atomique' teamworks/Dlg/DLG_Scenario.py
          ! grep -A90 'def Sauvegarde(self)' teamworks/Dlg/DLG_Scenario.py | grep -q 'DB.Commit()'
      - name: Committer le raccord
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teamworks/Dlg/DLG_Scenario.py
          git commit -m 'fix: raccorder la sauvegarde scénario atomique'
          git push origin HEAD:fix/0.9.2-scenario-atomicity
