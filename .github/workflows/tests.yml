name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest six

      - name: Compile Python sources
        run: python -m compileall application domain infrastructure scripts teamworks/CcnsCore tests

      - name: Reject removed Python 2 builtins
        run: >-
          python scripts/audit_runtime_risks.py .
          --fail-on-python2-builtins
          --json python2-builtins-audit.json

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload Python 2 builtins audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python2-builtins-audit
          path: python2-builtins-audit.json
          if-no-files-found: error
          retention-days: 1
