name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest six

      - name: Compile Python sources
        run: python -m compileall application domain infrastructure scripts teamworks/CcnsCore tests

      - name: Audit known runtime compatibility risks
        run: >-
          python scripts/audit_runtime_risks.py .
          --fail-on-python2-builtins
          --fail-on-missing-handlers
          --json runtime-risk-audit.json

      - name: Reject new SQLite bytes paths
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("runtime-risk-audit.json").read_text(encoding="utf-8"))
          current = report["counts"].get("sqlite-bytes-path", 0)
          historical_ceiling = 4
          if current > historical_ceiling:
              raise SystemExit(
                  f"SQLite bytes paths increased from {historical_ceiling} to {current}"
              )
          print(f"SQLite bytes paths: {current}/{historical_ceiling}")
          PY

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Upload runtime risk audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-risk-audit
          path: runtime-risk-audit.json
          if-no-files-found: error
          retention-days: 1
