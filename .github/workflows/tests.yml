name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-tw-102:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/tw-102-bitmapfromimage-phoenix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TW-102 branch
        uses: actions/checkout@v4
        with:
          ref: agent/tw-102-bitmapfromimage-phoenix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Replace Classic BitmapFromImage calls
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('teamworks')
          changed = []
          count = 0
          for path in root.rglob('*.py'):
              data = path.read_bytes()
              for encoding in ('utf-8', 'iso-8859-15', 'cp1252'):
                  try:
                      text = data.decode(encoding)
                      break
                  except UnicodeDecodeError:
                      continue
              else:
                  continue
              occurrences = text.count('wx.BitmapFromImage(')
              if not occurrences:
                  continue
              text = text.replace('wx.BitmapFromImage(', 'wx.Bitmap(')
              path.write_text(text, encoding='utf-8')
              changed.append(path)
              count += occurrences

          if count != 9:
              raise SystemExit(f'Inventaire TW-102 inattendu: {count} appels remplacés au lieu de 9')

          test = Path('tests/test_no_bitmapfromimage.py')
          test.write_text(
              "from pathlib import Path\n\n\n"
              "def test_no_wx_bitmapfromimage_remains():\n"
              "    offenders = []\n"
              "    for path in Path('teamworks').rglob('*.py'):\n"
              "        text = path.read_text(encoding='utf-8')\n"
              "        if 'wx.BitmapFromImage(' in text:\n"
              "            offenders.append(str(path))\n"
              "    assert offenders == []\n",
              encoding='utf-8',
          )
          print(f'Remplaced {count} calls in {len(changed)} files')
          PY
      - name: Validate TW-102
        run: |
          python -m compileall -q teamworks tests/test_no_bitmapfromimage.py
          python -m pytest -q tests/test_no_bitmapfromimage.py
          git diff --check
      - name: Commit TW-102 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks tests/test_no_bitmapfromimage.py
          git commit -m "TW-102 — Remplacer wx.BitmapFromImage par wx.Bitmap"
          git push origin HEAD:agent/tw-102-bitmapfromimage-phoenix

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest six

      - name: Compile Python sources
        run: python -m compileall application domain infrastructure scripts teamworks/CcnsCore tests

      - name: Audit known runtime compatibility risks
        run: >-
          python scripts/audit_runtime_risks.py .
          --fail-on-python2-builtins
          --fail-on-missing-handlers
          --json runtime-risk-audit.json

      - name: Reject new SQLite bytes paths
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("runtime-risk-audit.json").read_text(encoding="utf-8"))
          current = report["counts"].get("sqlite-bytes-path", 0)
          historical_ceiling = 4
          if current > historical_ceiling:
              raise SystemExit(
                  f"SQLite bytes paths increased from {historical_ceiling} to {current}"
              )
          print(f"SQLite bytes paths: {current}/{historical_ceiling}")
          PY

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Upload runtime risk audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-risk-audit
          path: runtime-risk-audit.json
          if-no-files-found: error
          retention-days: 1
