name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-tw-100:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/tw-100-thumbnailctrl-image-phoenix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TW-100 branch
        uses: actions/checkout@v4
        with:
          ref: agent/tw-100-thumbnailctrl-image-phoenix
      - name: Apply Phoenix-only image loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('teamworks/Ctrl/CTRL_thumbnailctrl.py')
          data = path.read_bytes()
          text = data.decode('iso-8859-15')
          old = """def getShadow():\n    if 'phoenix' in wx.PlatformInfo:\n        fonction = wx.Image\n    else :\n        fonction = wx.ImageFromStream\n    sh_tr = fonction(six.BytesIO(getDataTR())).ConvertToBitmap()\n    sh_bl = fonction(six.BytesIO(getDataBL())).ConvertToBitmap()\n    sh_sh = fonction(six.BytesIO(getDataSH())).Rescale(500, 500, wx.IMAGE_QUALITY_HIGH)\n"""
          new = """def getShadow():\n    sh_tr = wx.Image(six.BytesIO(getDataTR())).ConvertToBitmap()\n    sh_bl = wx.Image(six.BytesIO(getDataBL())).ConvertToBitmap()\n    sh_sh = wx.Image(six.BytesIO(getDataSH())).Rescale(500, 500, wx.IMAGE_QUALITY_HIGH)\n"""
          if old not in text:
              print('TW-100 block already patched')
          else:
              text = text.replace(old, new, 1)
              text = text.replace('# -*- coding: iso-8859-15 -*-', '# -*- coding: utf-8 -*-', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit TW-100 patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_thumbnailctrl.py
          git commit -m "TW-100 — Moderniser le chargement des ombres ThumbnailCtrl"
          git push origin HEAD:agent/tw-100-thumbnailctrl-image-phoenix

  apply-tw-101:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'agent/tw-101-thumbnailctrl-setalpha-phoenix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TW-101 branch
        uses: actions/checkout@v4
        with:
          ref: agent/tw-101-thumbnailctrl-setalpha-phoenix
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TW-101 test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Apply direct SetAlpha loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('teamworks/Ctrl/CTRL_thumbnailctrl.py')
          text = path.read_text(encoding='utf-8')
          old = """        if \"A\" in pil.getbands():\n            if 'phoenix' in wx.PlatformInfo:\n                img.SetAlpha(pil.convert(\"RGBA\").tobytes()[3::4])\n            else:\n                img.SetAlphaData(pil.convert(\"RGBA\").tobytes()[3::4])\n            alpha = True\n"""
          new = """        if \"A\" in pil.getbands():\n            img.SetAlpha(pil.convert(\"RGBA\").tobytes()[3::4])\n            alpha = True\n"""
          if old not in text:
              raise SystemExit('Expected TW-101 SetAlpha block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_thumbnailctrl_setalpha_phoenix.py')
          test.write_text(
              "from pathlib import Path\n\n\n"
              "SOURCE_PATH = Path('teamworks/Ctrl/CTRL_thumbnailctrl.py')\n\n\n"
              "def test_thumbnailctrl_uses_setalpha_directly():\n"
              "    source = SOURCE_PATH.read_text(encoding='utf-8')\n"
              "    start = source.index('def PILtoWx')\n"
              "    end = source.index('def', start + len('def PILtoWx'))\n"
              "    function_source = source[start:end]\n\n"
              "    assert \"'phoenix' in wx.PlatformInfo\" not in function_source\n"
              "    assert 'SetAlphaData' not in function_source\n"
              "    assert 'img.SetAlpha(' in function_source\n",
              encoding='utf-8',
          )
          PY
      - name: Validate TW-101
        run: |
          python -m py_compile teamworks/Ctrl/CTRL_thumbnailctrl.py
          python -m pytest -q tests/test_thumbnailctrl_setalpha_phoenix.py
          git diff --check
      - name: Commit TW-101 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_thumbnailctrl.py tests/test_thumbnailctrl_setalpha_phoenix.py
          git commit -m "TW-101 — Utiliser directement wx.Image.SetAlpha dans ThumbnailCtrl"
          git push origin HEAD:agent/tw-101-thumbnailctrl-setalpha-phoenix

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest six

      - name: Compile Python sources
        run: python -m compileall application domain infrastructure scripts teamworks/CcnsCore tests

      - name: Audit known runtime compatibility risks
        run: >-
          python scripts/audit_runtime_risks.py .
          --fail-on-python2-builtins
          --fail-on-missing-handlers
          --json runtime-risk-audit.json

      - name: Reject new SQLite bytes paths
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("runtime-risk-audit.json").read_text(encoding="utf-8"))
          current = report["counts"].get("sqlite-bytes-path", 0)
          historical_ceiling = 4
          if current > historical_ceiling:
              raise SystemExit(
                  f"SQLite bytes paths increased from {historical_ceiling} to {current}"
              )
          print(f"SQLite bytes paths: {current}/{historical_ceiling}")
          PY

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest 2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Upload runtime risk audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-risk-audit
          path: runtime-risk-audit.json
          if-no-files-found: error
          retention-days: 1
