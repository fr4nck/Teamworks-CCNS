name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install --requirement .github/requirements-ci.txt

      - name: Compile complete Python source tree
        run: python -m compileall -q application domain infrastructure scripts tools teamworks tests

      - name: Check essential runtime components
        run: python scripts/check_essential_runtime.py

      - name: Audit known runtime compatibility risks
        run: >-
          python scripts/audit_runtime_risks.py .
          --fail-on-python2-builtins
          --fail-on-missing-handlers
          --json runtime-risk-audit.json

      - name: Reject new SQLite bytes paths
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("runtime-risk-audit.json").read_text(encoding="utf-8"))
          current = report["counts"].get("sqlite-bytes-path", 0)
          historical_ceiling = 4
          if current > historical_ceiling:
              raise SystemExit(
                  f"SQLite bytes paths increased from {historical_ceiling} to {current}"
              )
          print(f"SQLite bytes paths: {current}/{historical_ceiling}")
          PY

      - name: Run focused migration audits
        shell: bash
        run: |
          python tools/find_redundant_phoenix_branches.py teamworks/Ctrl --check
          python tools/find_mutable_defaults.py teamworks > mutable-defaults.txt
          python tools/inventory_external_imports.py --path teamworks --json external-imports.json --markdown external-imports.md
          python tools/inventory_python_compile_errors.py --path teamworks --json python-compile-errors.json --markdown python-compile-errors.md

      - name: Run test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt

      - name: Upload consolidated diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            pytest-output.txt
            runtime-risk-audit.json
            mutable-defaults.txt
            external-imports.json
            external-imports.md
            python-compile-errors.json
            python-compile-errors.md
          if-no-files-found: warn
          retention-days: 1
