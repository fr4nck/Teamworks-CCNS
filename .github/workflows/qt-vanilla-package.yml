name: Packaging Qt Vanilla 0.1

on:
  pull_request:
    branches:
      - qt/rail-c-documents-rh
      - qt/master
    paths:
      - ".github/workflows/qt-vanilla-package.yml"
      - "requirements/qt-vanilla-0.1.txt"
      - "scripts/build_qt_vanilla_windows.ps1"
      - "packaging/windows/Teamworks-CCNS-Qt.iss"
      - "poc/qt-theme/**"
      - "application/**"
      - "domain/**"
      - "infrastructure/**"
      - "teamworks/GestionDB.py"
      - "teamworks/Utils/UTILS_Fichiers.py"
      - "tests/test_qt_vanilla_packaging_contract.py"
  # Build an installer for selected user-facing Qt milestones and packaging edits.
  # Routine engine commits keep the fast Qt validation workflow only.
  push:
    branches:
      - qt/master
    paths:
      - ".github/workflows/qt-vanilla-package.yml"
      - "requirements/qt-vanilla-0.1.txt"
      - "scripts/build_qt_vanilla_windows.ps1"
      - "packaging/windows/Teamworks-CCNS-Qt.iss"
      - "poc/qt-theme/vanilla_launcher.py"
      - "poc/qt-theme/person_editor.py"
      - "poc/qt-theme/pilot_generalities.py"
      - "infrastructure/persistence/person_generalities_write_adapter.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  package-windows:
    name: Qt Vanilla — build / install / smoke Windows
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/qt-vanilla-0.1.txt

      - name: Installer le runtime Qt sans wx et les outils de build
        shell: pwsh
        run: |
          python -m pip install --requirement requirements/qt-vanilla-0.1.txt
          python -m pip install "pyinstaller>=6.10,<7" pytest
          python -c "import importlib.util; assert importlib.util.find_spec('wx') is None, 'wxPython ne doit pas être installé dans le build Qt Vanilla'"

      - name: Vérifier les frontières headless et le contrat de packaging
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$pwd\teamworks;$pwd"
          python -c "import GestionDB; from Utils import UTILS_Fichiers; print('runtime legacy headless OK')"
          python -m pytest -q `
            tests/test_qt_vanilla_packaging_contract.py `
            tests/test_contract_document_workspace.py `
            tests/test_qt_contract_documents.py `
            tests/test_qt_contract_write_roundtrip.py `
            tests/test_person_generalities_write.py `
            tests/test_person_generalities_write_adapter.py `
            tests/test_qt_person_details_roundtrip.py

      - name: Construire Qt Vanilla et le portable
        shell: pwsh
        run: .\scripts\build_qt_vanilla_windows.ps1 -Version "0.1.0"

      - name: Smoke du runtime figé
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/qt-vanilla/Teamworks-CCNS-Qt/Teamworks-CCNS-Qt.exe").Path
          $env:TEAMWORKS_QT_SOURCE = "smoke"
          $env:TEAMWORKS_QT_AUTOCLOSE_MS = "1200"
          $process = Start-Process -FilePath $exe -PassThru
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force
            throw "Le runtime Qt figé ne s'est pas fermé après le smoke."
          }
          if ($process.ExitCode -ne 0) {
            throw "Le runtime Qt figé a quitté avec le code $($process.ExitCode)."
          }

      - name: Smoke production sur base fictive (copie Portable isolée)
        shell: pwsh
        run: |
          # Chaîne réelle : précontrôle de schéma, GestionDB, chargement des personnes.
          # Effectué sur une copie : le dossier livré et l'installateur restent sans Portable.
          $source = (Resolve-Path "dist/qt-vanilla/Teamworks-CCNS-Qt").Path
          $copy = Join-Path $env:RUNNER_TEMP "qt-production-smoke"
          Remove-Item $copy -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $source $copy -Recurse
          $data = Join-Path $copy "Portable/Data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          foreach ($suffix in "TDATA", "TPHOTOS", "TDOCUMENTS") {
            Copy-Item "teamworks/Static/Exemples/Exemple_$suffix.dat" (Join-Path $data "Recette_$suffix.dat")
          }
          '{"nomFichier": "Recette"}' | Set-Content -Path (Join-Path $copy "Portable/Config.json") -Encoding utf8
          $env:TEAMWORKS_QT_SOURCE = "production"
          $env:TEAMWORKS_QT_AUTOCLOSE_MS = "4000"
          $process = Start-Process -FilePath (Join-Path $copy "Teamworks-CCNS-Qt.exe") -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Le runtime Qt figé (production) ne s'est pas fermé."
          }
          if ($process.ExitCode -ne 0) {
            Get-ChildItem (Join-Path $copy "Portable/Logs") -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            throw "Le runtime Qt figé (production) a quitté avec le code $($process.ExitCode)."
          }
          if (Test-Path (Join-Path $source "Portable")) { throw "Le dossier livré ne doit pas contenir de Portable." }

      - name: Exe réel contre MySQL 5.7.31 synthétique (diagnostic, démarrage, erreurs)
        shell: pwsh
        run: |
          # Version des exports historiques de production. Serveur éphémère, base
          # et compte fictifs ; l'exe testé est une copie, le dossier livré reste intact.
          $ErrorActionPreference = "Stop"
          $version = "5.7.31"
          $zip = Join-Path $env:RUNNER_TEMP "mysql-$version-winx64.zip"
          curl.exe -L --fail --retry 3 "https://downloads.mysql.com/archives/get/p/23/file/mysql-$version-winx64.zip" -o $zip
          if ($LASTEXITCODE -ne 0) { throw "Téléchargement de MySQL $version impossible" }
          7z x $zip "-o$env:RUNNER_TEMP" -y | Out-Null
          $base = Join-Path $env:RUNNER_TEMP "mysql-$version-winx64"
          if (-not (Test-Path "$env:WINDIR\System32\msvcr120.dll")) { choco install vcredist2013 --yes --no-progress }
          $data = Join-Path $env:RUNNER_TEMP "mysql57-data"
          & "$base\bin\mysqld.exe" --no-defaults --initialize-insecure "--basedir=$base" "--datadir=$data"
          if ($LASTEXITCODE -ne 0) { throw "Initialisation de MySQL $version échouée" }
          Start-Process "$base\bin\mysqld.exe" -ArgumentList @(
            "--no-defaults", "--basedir=$base", "--datadir=$data", "--port=3308",
            "--bind-address=127.0.0.1", "--log-error=$env:RUNNER_TEMP\mysql57.log"
          ) | Out-Null

          $env:PYTHONPATH = "$pwd\teamworks;$pwd"
          $prepare = Join-Path $env:RUNNER_TEMP "prepare_mysql57.py"
          @'
          import sys, time
          import mysql.connector
          import GestionDB
          from Data import DATA_Tables

          for _ in range(90):
              try:
                  admin = mysql.connector.connect(host="127.0.0.1", port=3308, user="root", password="",
                                                  use_pure=True, ssl_disabled=True, connection_timeout=2)
                  break
              except Exception as exc:
                  last = exc
                  time.sleep(1)
          else:
              raise SystemExit("MySQL 5.7.31 indisponible : %r" % (last,))
          cursor = admin.cursor()
          cursor.execute("SELECT VERSION()")
          print("serveur", cursor.fetchone()[0])
          cursor.execute("CREATE USER 'recette'@'127.0.0.1' IDENTIFIED BY 'mdp-fictif-ci'")
          cursor.execute("GRANT ALL ON recette_tdata.* TO 'recette'@'127.0.0.1'")
          admin.close()
          db = GestionDB.DB(nomFichier="3308;127.0.0.1;root;[RESEAU]recette_tdata", suffixe=None, modeCreation=True)
          assert db.echec == 0, getattr(db, "erreur", None)
          db.CreationTables(DATA_Tables.DB_DATA)
          db.cursor.execute("INSERT INTO parametres (categorie, nom, parametre) VALUES ('fichier', 'version', '2.1.2.0')")
          db.cursor.execute("INSERT INTO personnes (IDpersonne, nom, prenom) VALUES (1, 'FICTIF', 'Ada')")
          db.Commit()
          db.Close()
          print(GestionDB.EncodeMdpReseau(sys.argv[1]))
          '@ | Set-Content -Path $prepare -Encoding utf8
          $token = (python $prepare "mdp-fictif-ci" | Select-Object -Last 1)
          $wrong = (python -c "import GestionDB; print(GestionDB.EncodeMdpReseau('mauvais-mdp-ci'))" | Select-Object -Last 1)

          $copy = Join-Path $env:RUNNER_TEMP "qt-mysql57"
          Copy-Item (Resolve-Path "dist/qt-vanilla/Teamworks-CCNS-Qt").Path $copy -Recurse
          New-Item -ItemType Directory -Path (Join-Path $copy "Portable") | Out-Null
          $evidence = Join-Path $env:RUNNER_TEMP "qt-mysql57-preuves"
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $env:TEAMWORKS_QT_DIAGNOSTIC_DIR = $evidence
          $env:TEAMWORKS_QT_AUTOCLOSE_MS = "4000"
          $env:TEAMWORKS_QT_SOURCE = "production"

          function Invoke-Exe([string]$Reference, [string[]]$Arguments, [int]$Expected, [string]$Label) {
            ('{"nomFichier": "' + $Reference + '"}') | Set-Content -Path (Join-Path $copy "Portable/Config.json") -Encoding utf8
            $before = @(Get-ChildItem $evidence -Filter "diagnostic-mysql-*.txt").Count
            $process = if ($Arguments) { Start-Process (Join-Path $copy "Teamworks-CCNS-Qt.exe") -ArgumentList $Arguments -PassThru } else { Start-Process (Join-Path $copy "Teamworks-CCNS-Qt.exe") -PassThru }
            $null = $process.Handle
            if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw "$Label : l'exe ne s'est pas fermé" }
            if ($process.ExitCode -ne $Expected) { throw "$Label : code $($process.ExitCode), attendu $Expected" }
            $reports = @(Get-ChildItem $evidence -Filter "diagnostic-mysql-*.txt" | Sort-Object LastWriteTime)
            if ($Arguments -and $reports.Count -ne $before + 1) { throw "$Label : rapport absent" }
            Write-Host "$Label : code $($process.ExitCode) (attendu)"
            Start-Sleep -Seconds 1
            if ($Arguments) { return (Get-Content $reports[-1].FullName -Raw -Encoding utf8) }
          }

          function Assert-NoSecret([string]$Text) {
            foreach ($secret in @($token, $token.Substring(4), "mdp-fictif-ci", $wrong, "mauvais-mdp-ci", "[RESEAU]")) {
              if ($Text.Contains($secret)) { throw "Secret présent dans le rapport" }
            }
            if ($Text.Contains("ImportError") -or $Text.Contains("localization")) { throw "ImportError dans le rapport" }
          }

          $good = "3308;127.0.0.1;recette;$token[RESEAU]recette"
          $text = Invoke-Exe $good @("--diagnostic-mysql") 0 "Diagnostic, compte valide"
          Write-Host $text
          foreach ($expected in "serveur MySQL 5.7.31", "mysql_native_password", "Modules dynamiques du pilote : tous présents", "« recette_tdata » ouverte", "Résultat : CONFORME") {
            if (-not $text.Contains($expected)) { throw "Rapport incomplet : $expected" }
          }
          Assert-NoSecret $text
          Invoke-Exe $good @() 0 "Démarrage production sur MySQL 5.7.31"

          $text = Invoke-Exe "3308;127.0.0.1;recette;$wrong[RESEAU]recette" @("--diagnostic-mysql") 6 "Diagnostic, mot de passe refusé"
          Write-Host $text
          if (-not ($text.Contains("3. Authentification : ÉCHEC") -and $text.Contains("1045"))) { throw "Refus d'authentification mal diagnostiqué" }
          Assert-NoSecret $text
          Invoke-Exe "3308;127.0.0.1;recette;$wrong[RESEAU]recette" @() 3 "Démarrage production refusé (mot de passe)"

          $text = Invoke-Exe "3309;127.0.0.1;recette;$token[RESEAU]recette" @("--diagnostic-mysql") 6 "Diagnostic, port fermé"
          Write-Host $text
          if (-not $text.Contains("1. TCP : ÉCHEC")) { throw "Port fermé mal diagnostiqué" }
          Assert-NoSecret $text

          $text = Invoke-Exe "3308;127.0.0.1;recette;$token[RESEAU]inconnue" @("--diagnostic-mysql") 6 "Diagnostic, base inconnue"
          Write-Host $text
          if (-not $text.Contains("4. Sélection de la base : ÉCHEC")) { throw "Base inconnue mal diagnostiquée" }
          Assert-NoSecret $text

      - name: Publier les rapports du diagnostic MySQL 5.7.31 (fictifs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-mysql57-diagnostics
          if-no-files-found: ignore
          path: ${{ runner.temp }}/qt-mysql57-preuves

      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compiler l'installateur
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable." }
          & $iscc "/DAppVersion=0.1.0" "packaging/windows/Teamworks-CCNS-Qt.iss"
          if ($LASTEXITCODE -ne 0) { throw "Compilation Inno Setup échouée." }

      - name: Installer, lancer et désinstaller silencieusement
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist/qt-vanilla/installer/Teamworks-CCNS-Qt-0.1.0-windows-x64-setup.exe").Path
          $target = Join-Path $env:TEMP "Teamworks-CCNS-Qt-Vanilla-Test"
          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/NORESTART", "/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installation silencieuse échouée : $($install.ExitCode)" }
          $exe = Join-Path $target "Teamworks-CCNS-Qt.exe"
          if (-not (Test-Path $exe)) { throw "Exécutable installé introuvable." }
          if (Test-Path (Join-Path $target "Portable")) { throw "L'installateur ne doit jamais installer le mode Portable." }
          $env:TEAMWORKS_QT_SOURCE = "smoke"
          $env:TEAMWORKS_QT_AUTOCLOSE_MS = "1200"
          $app = Start-Process -FilePath $exe -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Smoke de l'installation échoué : $($app.ExitCode)" }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Désinstalleur introuvable." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Désinstallation silencieuse échouée : $($uninstall.ExitCode)" }

      - name: Calculer les sommes SHA-256
        shell: pwsh
        run: |
          $portable = (Resolve-Path "dist/qt-vanilla/Teamworks-CCNS-Qt-0.1.0-windows-x64-portable.zip").Path
          $setup = (Resolve-Path "dist/qt-vanilla/installer/Teamworks-CCNS-Qt-0.1.0-windows-x64-setup.exe").Path
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          @("$portableHash  $(Split-Path $portable -Leaf)", "$setupHash  $(Split-Path $setup -Leaf)") | Set-Content -Path "dist/qt-vanilla/SHA256SUMS.txt" -Encoding ascii

      - name: Publier les artefacts de qualification
        uses: actions/upload-artifact@v4
        with:
          name: teamworks-qt-vanilla-0.1-windows
          if-no-files-found: error
          path: |
            dist/qt-vanilla/Teamworks-CCNS-Qt-0.1.0-windows-x64-portable.zip
            dist/qt-vanilla/installer/Teamworks-CCNS-Qt-0.1.0-windows-x64-setup.exe
            dist/qt-vanilla/SHA256SUMS.txt
