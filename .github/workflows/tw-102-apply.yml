name: TW-102 apply BitmapFromImage Phoenix

on:
  push:
    branches:
      - agent/tw-102-bitmapfromimage-phoenix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tw-102-bitmapfromimage-phoenix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Replace wx.BitmapFromImage with wx.Bitmap
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('teamworks')
          changed = []
          count = 0
          for path in root.rglob('*.py'):
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  text = path.read_text(encoding='iso-8859-15')
              occurrences = text.count('wx.BitmapFromImage(')
              if not occurrences:
                  continue
              text = text.replace('wx.BitmapFromImage(', 'wx.Bitmap(')
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
              count += occurrences

          if not changed:
              raise SystemExit('No active wx.BitmapFromImage occurrence found')

          test = Path('tests/test_no_bitmapfromimage.py')
          test.write_text(
              "from pathlib import Path\n\n\n"
              "def test_no_active_bitmapfromimage_usage():\n"
              "    offenders = []\n"
              "    for path in Path('teamworks').rglob('*.py'):\n"
              "        text = path.read_text(encoding='utf-8')\n"
              "        for number, line in enumerate(text.splitlines(), 1):\n"
              "            stripped = line.strip()\n"
              "            if 'wx.BitmapFromImage(' in line and not stripped.startswith('#'):\n"
              "                offenders.append(f'{path}:{number}')\n"
              "    assert not offenders, 'Classic wx.BitmapFromImage remains: ' + ', '.join(offenders)\n",
              encoding='utf-8',
          )
          Path('tw-102-changed-files.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print(f'Replaced {count} call(s) in {len(changed)} file(s)')
          PY
      - name: Validate TW-102
        run: |
          while IFS= read -r file; do python -m py_compile "$file"; done < tw-102-changed-files.txt
          python -m pytest -q tests/test_no_bitmapfromimage.py
          git diff --check
      - name: Commit TW-102
        run: |
          rm tw-102-changed-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks tests/test_no_bitmapfromimage.py
          git commit -m "TW-102 — Remplacer wx.BitmapFromImage par wx.Bitmap"
          git push origin HEAD:agent/tw-102-bitmapfromimage-phoenix
