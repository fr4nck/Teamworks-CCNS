name: Stabilisation fix presence lists

on:
  pull_request:
    branches:
      - master
    paths:
      - "tools/fix_presence_maxsize.py"
      - ".github/workflows/stabilisation-fix-presence-maxsize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilisation branch
        uses: actions/checkout@v4
        with:
          ref: stabilisation/recette-fonctionnelle-secondaire

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply idempotent correction
        run: python tools/fix_presence_maxsize.py

      - name: Verify corrected sources
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('teamworks/Dlg/DLG_Saisie_presence.py'),
              Path('teamworks/Ctrl/CTRL_Presences.py'),
          )
          forbidden = (
              'InsertItem(six.MAXSIZE,',
              'InsertItem(sys.maxsize,',
              'InsertStringItem(six.MAXSIZE,',
              'InsertStringItem(sys.maxsize,',
          )
          for path in paths:
              source = path.read_text(encoding='iso-8859-15')
              for token in forbidden:
                  assert token not in source, (path, token)
              if 'CheckListCtrlMixin' in source:
                  assert 'self.EnableCheckBoxes(True)' in source, path
              compile(source, str(path), 'exec')
          assert any(
              'InsertItem(self.GetItemCount(),' in path.read_text(encoding='iso-8859-15')
              for path in paths
          )
          PY

      - name: Commit corrected presence lists
        shell: bash
        run: |
          if git diff --quiet -- teamworks/Dlg/DLG_Saisie_presence.py teamworks/Ctrl/CTRL_Presences.py; then
            echo "Presence lists already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Saisie_presence.py teamworks/Ctrl/CTRL_Presences.py
          git commit -m "Stabilisation — activer les cases des listes de présence Phoenix"
          git push origin HEAD:stabilisation/recette-fonctionnelle-secondaire
