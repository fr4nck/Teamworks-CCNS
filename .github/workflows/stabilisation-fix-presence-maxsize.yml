name: Stabilisation fix presence list insertion

on:
  pull_request:
    branches:
      - master
    paths:
      - "tools/fix_presence_maxsize.py"
      - ".github/workflows/stabilisation-fix-presence-maxsize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stabilisation branch
        uses: actions/checkout@v4
        with:
          ref: stabilisation/recette-fonctionnelle-secondaire

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply idempotent correction
        run: python tools/fix_presence_maxsize.py

      - name: Verify corrected source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('teamworks/Dlg/DLG_Saisie_presence.py')
          source = path.read_text(encoding='iso-8859-15')
          assert 'InsertItem(sys.maxsize' not in source
          assert 'InsertItem(six.MAXSIZE' not in source
          assert source.count('self.InsertItem(self.GetItemCount(), "")') >= 1
          compile(source, str(path), 'exec')
          PY

      - name: Commit corrected form
        shell: bash
        run: |
          if git diff --quiet -- teamworks/Dlg/DLG_Saisie_presence.py; then
            echo "Form already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Saisie_presence.py
          git commit -m "Stabilisation — utiliser un index valide dans la liste des présences"
          git push origin HEAD:stabilisation/recette-fonctionnelle-secondaire
