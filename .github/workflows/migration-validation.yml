name: Validation migration

on:
  pull_request:
    branches:
      - master
    paths:
      - "domain/migration/**"
      - "infrastructure/persistence/legacy_inventory_sql.py"
      - "infrastructure/persistence/legacy_sqlite_inventory_adapter.py"
      - "infrastructure/persistence/legacy_mysql_inventory_adapter.py"
      - "tools/inventory_legacy_database.py"
      - "docs/66-strategie-migration-noethys-teamworks.md"
      - "docs/67-pilote-migration-frais.md"
      - "docs/68-inventaire-legacy-database.md"
      - "tests/test_migration_reconciliation.py"
      - "tests/test_migration_expense_pilot.py"
      - "tests/test_migration_inventory_model.py"
      - "tests/test_migration_inventory_engine.py"
      - "tests/test_migration_expense_inventory.py"
      - "tests/test_migration_expense_inventory_loader.py"
      - "tests/test_migration_report.py"
      - "tests/test_legacy_sqlite_inventory_adapter.py"
      - "tests/test_legacy_mysql_inventory_adapter.py"
      - "tests/test_migration_inventory_end_to_end.py"
      - "tests/test_inventory_legacy_database_cli.py"
      - ".github/workflows/migration-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-contracts:
    name: Contrats de migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer pytest
        run: python -m pip install pytest==8.4.1

      - name: Compiler le domaine migration
        run: >-
          python -m compileall -q
          domain/migration
          infrastructure/persistence/legacy_inventory_sql.py
          infrastructure/persistence/legacy_sqlite_inventory_adapter.py
          infrastructure/persistence/legacy_mysql_inventory_adapter.py
          tools/inventory_legacy_database.py
          tests/test_migration_reconciliation.py
          tests/test_migration_expense_pilot.py
          tests/test_migration_inventory_model.py
          tests/test_migration_inventory_engine.py
          tests/test_migration_expense_inventory.py
          tests/test_migration_expense_inventory_loader.py
          tests/test_migration_report.py
          tests/test_legacy_sqlite_inventory_adapter.py
          tests/test_legacy_mysql_inventory_adapter.py
          tests/test_migration_inventory_end_to_end.py
          tests/test_inventory_legacy_database_cli.py

      - name: Vérifier les contrats de réconciliation et l'inventaire
        run: >-
          python -m pytest -q
          tests/test_migration_reconciliation.py
          tests/test_migration_expense_pilot.py
          tests/test_migration_inventory_model.py
          tests/test_migration_inventory_engine.py
          tests/test_migration_expense_inventory.py
          tests/test_migration_expense_inventory_loader.py
          tests/test_migration_report.py
          tests/test_legacy_sqlite_inventory_adapter.py
          tests/test_legacy_mysql_inventory_adapter.py
          tests/test_migration_inventory_end_to_end.py
          tests/test_inventory_legacy_database_cli.py