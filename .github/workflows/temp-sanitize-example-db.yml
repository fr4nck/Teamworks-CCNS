name: Temporary sanitize example database

on:
  push:
    branches:
      - packaging/clean-example-database

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: packaging/clean-example-database
          fetch-depth: 0

      - name: Nettoyer la base exemple
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3

          path = Path('teamworks/Static/Exemples/Exemple_TDATA.dat')
          con = sqlite3.connect(path)
          row = con.execute("SELECT save_destination FROM divers WHERE IDdivers=1").fetchone()
          if row is None:
              raise SystemExit('Ligne divers IDdivers=1 introuvable')
          if row[0] not in ('C:/Users/Ivan/Documents', ''):
              raise SystemExit(f'Valeur inattendue de save_destination: {row[0]!r}')
          con.execute("UPDATE divers SET save_destination='' WHERE IDdivers=1")
          con.commit()
          con.close()

          data = path.read_bytes()
          for marker in (b'Ivan', b'C:/Users', b'C:\\Users'):
              if marker in data:
                  raise SystemExit(f'Trace personnelle encore présente: {marker!r}')
          print('Base exemple nettoyée et contrôlée.')
          PY

      - name: Commit auto-nettoyant
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sanitize-example-db.yml
          git add teamworks/Static/Exemples/Exemple_TDATA.dat
          git diff --cached --stat
          git commit -m "Packaging: nettoyer la base exemple historique"
          git push origin HEAD:packaging/clean-example-database
