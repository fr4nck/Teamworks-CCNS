name: Stabilisation recruitment smoke

on:
  pull_request:
    branches: [master]
    paths:
      - "tools/smoke_secondary_recruitment.py"
      - "teamworks/Ctrl/CTRL_Page_candidatures.py"
      - "teamworks/Ol/OL_candidatures.py"
      - "teamworks/Ol/OL_entretiens.py"
      - ".github/workflows/stabilisation-recruitment-smoke.yml"
  workflow_dispatch:

jobs:
  recruitment:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --quiet -r requirements/python311-core.txt

      - name: Exercise recruitment page, filters and sorting
        id: smoke
        shell: pwsh
        continue-on-error: true
        run: python tools/smoke_secondary_recruitment.py

      - name: Upload recruitment diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-smoke-diagnostic
          path: artifacts/recruitment-smoke/diagnostic.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Ensure temporary entry point was removed
        if: always()
        shell: pwsh
        run: |
          if (Test-Path teamworks/Teamworks_secondary_recruitment_smoke.py) {
            throw "Temporary recruitment entry point was not removed"
          }

      - name: Fail when recruitment smoke failed
        if: steps.smoke.outcome != 'success'
        shell: pwsh
        run: throw "Recruitment smoke failed; inspect recruitment-smoke-diagnostic"
