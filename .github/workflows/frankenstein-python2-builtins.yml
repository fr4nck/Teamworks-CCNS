name: Frankenstein Python 2 builtin migration

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_python2_builtin_names.py"
      - "tests/test_no_python2_builtin_names.py"
      - ".github/workflows/frankenstein-python2-builtins.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Python 2 builtin migration
        run: python tools/migrate_python2_builtin_names.py --write --path teamworks

      - name: Verify migrated builtin usages
        run: python -m pytest -q tests/test_no_python2_builtin_names.py

      - name: Compile changed Python sources
        run: python -m compileall -q teamworks
        continue-on-error: true

      - name: Commit migration
        run: |
          if git diff --quiet -- teamworks; then
            echo "No builtin migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks
          git commit -m "Frankenstein lot 2 — migrer les builtins Python 2 restants"
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
