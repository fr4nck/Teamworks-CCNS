name: Frankenstein DLG_Ouvrir_fichier six.PY2 migration

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_dlg_ouvrir_fichier_six_py2.py"
      - ".github/workflows/frankenstein-dlg-ouvrir-six-py2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove dead six.PY2 filename decoding branch
        run: python tools/migrate_dlg_ouvrir_fichier_six_py2.py --write

      - name: Verify migration
        run: python tools/migrate_dlg_ouvrir_fichier_six_py2.py --check

      - name: Commit migrated source
        run: |
          if git diff --quiet -- teamworks/Dlg/DLG_Ouvrir_fichier.py; then
            echo "No migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Ouvrir_fichier.py
          git commit -m "Frankenstein lot 2 — supprimer la branche six.PY2 de DLG_Ouvrir_fichier"
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
