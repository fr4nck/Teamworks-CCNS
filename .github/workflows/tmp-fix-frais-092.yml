name: tmp-fix-frais-092
on:
  push:
    branches: ["fix/0.9.2-frais-integrite-impression-distance"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("teamworks/Dlg/DLG_Impression_frais.py")
          s = p.read_text(encoding="utf-8")
          start = s.index("    def OnCheckItem(self, index, flag):")
          end = s.index("    def Importation(self):", start)
          replacement = "    def OnCheckItem(self, index, flag):\n        \"\"\"La sélection d'impression reste locale au dialogue.\"\"\"\n        pass\n\n      \n"
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding="utf-8")
          assert 'ReqMAJ("gadgets"' not in s
          compile(s, str(p), "exec")
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add teamworks/Dlg/DLG_Impression_frais.py
          git commit -m 'fix(frais): garder la sélection impression locale'
          git push
