name: tmp-fix-frais-092
on:
  push:
    branches:
      - fix/0.9.2-frais-integrite-impression-distance
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.9.2-frais-integrite-impression-distance
      - name: Remove print selection database side effect
        shell: python
        run: |
          from pathlib import Path
          path = Path('teamworks/Dlg/DLG_Impression_frais.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def OnCheckItem(self, index, flag):
        """ Ne fait rien si c'est le remplissage qui coche la case ! """
        if self.remplissage == False :
            IDgadget = self.GetItemData(index)
            # Enregistre l'affichage True/False du gadget dans la base
            DB = GestionDB.DB()
            listeDonnees = [("affichage",  str(flag)),]
            DB.ReqMAJ("gadgets", listeDonnees, "IDgadget", IDgadget)
            DB.Close()
        else:
            pass
'''
          new = '''    def OnCheckItem(self, index, flag):
        """La sélection d'impression reste locale au dialogue."""
        pass
'''
          if old not in text:
              raise SystemExit('bloc OnCheckItem attendu introuvable')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Verify source contract
        shell: python
        run: |
          from pathlib import Path
          text = Path('teamworks/Dlg/DLG_Impression_frais.py').read_text(encoding='utf-8')
          assert 'ReqMAJ("gadgets"' not in text
          compile(text, 'DLG_Impression_frais.py', 'exec')
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add teamworks/Dlg/DLG_Impression_frais.py
          git commit -m "fix(frais): garder la sélection d'impression locale"
          git push
