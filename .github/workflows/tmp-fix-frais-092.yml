name: tmp-fix-frais-092
on:
  push:
    branches: ["fix/0.9.2-frais-integrite-impression-distance"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frais
        run: |
          python - <<'PY'
          from pathlib import Path

          impression = Path("teamworks/Dlg/DLG_Impression_frais.py")
          s = impression.read_text(encoding="utf-8")
          marker = "    def OnCheckItem(self, index, flag):"
          if 'ReqMAJ("gadgets"' in s:
              start = s.index(marker)
              end = s.index("    def Importation(self):", start)
              replacement = "    def OnCheckItem(self, index, flag):\n        \"\"\"La sélection d'impression reste locale au dialogue.\"\"\"\n        pass\n\n      \n"
              s = s[:start] + replacement + s[end:]
              impression.write_text(s, encoding="utf-8")
          assert 'ReqMAJ("gadgets"' not in s
          compile(s, str(impression), "exec")

          deplacement = Path("teamworks/Dlg/DLG_Saisie_deplacement.py")
          s = deplacement.read_text(encoding="utf-8")
          old_depart = "        cp_depart = int(self.ctrl_cp_depart.GetValue())"
          old_arrivee = "        cp_arrivee = int(self.ctrl_cp_arrivee.GetValue())"
          if old_depart in s or old_arrivee in s:
              assert old_depart in s and old_arrivee in s
              s = s.replace(old_depart, "        cp_depart = self.ctrl_cp_depart.GetValue()", 1)
              s = s.replace(old_arrivee, "        cp_arrivee = self.ctrl_cp_arrivee.GetValue()", 1)
              deplacement.write_text(s, encoding="utf-8")
          assert old_depart not in s and old_arrivee not in s
          compile(s, str(deplacement), "exec")
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add teamworks/Dlg/DLG_Impression_frais.py teamworks/Dlg/DLG_Saisie_deplacement.py
          git commit -m 'fix(frais): supprimer les effets de bord et préserver les CP'
          git push
