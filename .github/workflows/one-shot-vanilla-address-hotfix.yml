name: One-shot vanilla address hotfix

on:
  push:
    branches:
      - vanilla-bugfix
    paths:
      - .github/workflows/one-shot-vanilla-address-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vanilla-bugfix
        uses: actions/checkout@v4
        with:
          ref: vanilla-bugfix
          fetch-depth: 0

      - name: Apply address field hotfix
        run: python scripts/apply_vanilla_address_hotfix.py

      - name: Compile patched module
        run: python -m py_compile teamworks/Ctrl/CTRL_Page_generalites.py

      - name: Commit the one-shot hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_Page_generalites.py
          git rm scripts/apply_vanilla_address_hotfix.py .github/workflows/one-shot-vanilla-address-hotfix.yml
          git commit -m "Vanilla: rendre le champ adresse saisissable"
          git push origin HEAD:vanilla-bugfix
