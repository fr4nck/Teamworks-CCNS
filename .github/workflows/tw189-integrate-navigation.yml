name: TW-189 integrate flexible navigation

# Second push: the workflow already exists on the branch, so GitHub can run it.
on:
  push:
    branches:
      - agent/tw-189-ui-theme-foundation
    paths:
      - .github/workflows/tw189-integrate-navigation.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tw-189-ui-theme-foundation
          fetch-depth: 0

      - name: Replace historical Toolbook
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("teamworks/Teamworks.py")
          source = path.read_text(encoding="utf-8")

          import_marker = "from Ctrl import CTRL_Recrutement\n"
          import_line = "from Ctrl import CTRL_Navigation_principale\n"
          if import_line not in source:
              if import_marker not in source:
                  raise SystemExit("CTRL_Recrutement import marker not found")
              source = source.replace(import_marker, import_marker + import_line, 1)

          replacement = '''class Toolbook(CTRL_Navigation_principale.NavigationPrincipale):
              """Navigation principale flexible, compatible avec l'API historique."""

              def __init__(self, parent):
                  CTRL_Navigation_principale.NavigationPrincipale.__init__(self, parent)
                  self.Build_Pages()

              def Build_Pages(self):
                  self.img_accueil = CTRL_Navigation_principale.BitmapNavigation(
                      Chemins.GetStaticPath("Images/32x32/Maison.png"), 28
                  )
                  self.img_personnes = CTRL_Navigation_principale.BitmapNavigation(
                      Chemins.GetStaticPath("Images/32x32/Personnes.png"), 28
                  )
                  self.img_presences = CTRL_Navigation_principale.BitmapNavigation(
                      Chemins.GetStaticPath("Images/32x32/Horloge.png"), 28
                  )
                  self.img_recrutement = CTRL_Navigation_principale.BitmapNavigation(
                      Chemins.GetStaticPath("Images/32x32/Recrutement.png"), 28
                  )

                  self.AddPage(
                      CTRL_Accueil.Panel(self),
                      _(u"Accueil"),
                      bitmap=self.img_accueil,
                      select=True,
                  )
                  self.AddPage(
                      CTRL_Personnes.PanelPersonnes(self),
                      _(u"Individus"),
                      bitmap=self.img_personnes,
                  )
                  self.AddPage(
                      CTRL_Presences.PanelPresences(self),
                      _(u"Présences"),
                      bitmap=self.img_presences,
                  )
                  self.AddPage(
                      CTRL_Recrutement.Panel(self),
                      _(u"Recrutement"),
                      bitmap=self.img_recrutement,
                  )

                  self.dict_pages_by_index = {
                      "accueil": 0,
                      "individus": 1,
                      "personnes": 1,
                      "presences": 2,
                      "recrutement": 3,
                  }


          '''

          pattern = re.compile(
              r"class Toolbook\(wx\.Toolbook\):.*?(?=class MyFrame\(wx\.Frame\):)",
              re.S,
          )
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"expected one historical Toolbook block, replaced {count}")

          path.write_text(source, encoding="utf-8", newline="\n")

      - name: Validate source and targeted contracts
        run: |
          python -m py_compile teamworks/Teamworks.py teamworks/Ctrl/CTRL_Navigation_principale.py
          python -m pytest \
            tests/test_main_navigation_layout.py \
            tests/test_direct_layout_refactor.py \
            tests/test_floating_gadgets.py \
            tests/test_persons_modern_layout.py \
            -q

      - name: Commit clean integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tw189-integrate-navigation.yml
          if [ -f teamworks/Teamworks.py.bak-tw189 ]; then
            git rm teamworks/Teamworks.py.bak-tw189
          fi
          git add teamworks/Teamworks.py
          git commit -m "TW-189 — Remplacer le Toolbook principal par une navigation flexible"
          git push origin HEAD:agent/tw-189-ui-theme-foundation
