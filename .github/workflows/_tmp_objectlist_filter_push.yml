name: Migration temporaire ObjectListView sur push

on:
  push:
    branches:
      - integration/post-tw189-tw182-tw184
    paths:
      - ".github/workflows/_tmp_objectlist_filter_push.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/post-tw189-tw182-tw184
          fetch-depth: 0
      - name: Migrer et vérifier
        run: |
          python scripts/_tmp_migrate_objectlist_filters.py
          python -m compileall -q teamworks tests/test_safe_list_filter_predicates.py
          python scripts/audit_rc_risks.py --fail-on-blockers
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_ObjectListView.py teamworks/Utils/UTILS_Filtres_listes.py tests/test_safe_list_filter_predicates.py
          git commit -m "Sécurité: remplacer le dernier eval des filtres de listes"
          git push origin HEAD:integration/post-tw189-tw182-tw184
