name: Frankenstein Python 3.11 checks

on:
  pull_request:
    branches:
      - master
    paths:
      - "teamworks/**/*.py"
      - "tools/**/*.py"
      - "tests/test_*.py"
      - ".github/workflows/frankenstein-python311-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python311-compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Test Python 3 CLI compatibility
        run: python -m pytest -q tests/test_python3_cli_compatibility.py

      - name: Test ListCtrl migrator
        run: python -m pytest -q tests/test_migrate_wx_listctrl.py

      - name: Test unicode migrator
        run: python -m pytest -q tests/test_migrate_python3_unicode.py

      - name: Test ListCtrl source compatibility
        run: python -m pytest -q tests/test_wx_listctrl_source_compatibility.py

      - name: Test SetStringItem migrator
        run: python -m pytest -q tests/test_migrate_wx_setstringitem.py

      - name: Test ObjectListView migration state
        run: python -m pytest -q tests/test_objectlistview_setstringitem_migration.py

      - name: Test completed migration audit
        run: python -m pytest -q tests/test_completed_python3_wx_migrations.py

      - name: Test wx image migrator
        run: python -m pytest -q tests/test_migrate_wx_empty_images.py

      - name: Inventory remaining wxPython Classic APIs
        run: |
          python tools/inventory_wx_classic_api.py --path teamworks \
            --json wx-classic-inventory.json \
            --markdown wx-classic-inventory.md
          cat wx-classic-inventory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wxPython Classic inventory
        uses: actions/upload-artifact@v4
        with:
          name: wx-classic-inventory
          path: |
            wx-classic-inventory.json
            wx-classic-inventory.md
          if-no-files-found: error

      - name: Compile migration tools and tests
        run: |
          python -m compileall -q tools \
            tests/test_python3_cli_compatibility.py \
            tests/test_migrate_wx_listctrl.py \
            tests/test_migrate_python3_unicode.py \
            tests/test_wx_listctrl_source_compatibility.py \
            tests/test_migrate_wx_setstringitem.py \
            tests/test_objectlistview_setstringitem_migration.py \
            tests/test_completed_python3_wx_migrations.py \
            tests/test_migrate_wx_empty_images.py

      - name: Report full legacy compile audit
        continue-on-error: true
        run: python -m compileall -q teamworks

  apply-wx-listctrl-migration-batch:
    if: github.event_name == 'pull_request' && github.head_ref == 'frankenstein/python3-wxphoenix-lot2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Migrate safe wx ListCtrl calls in one batch
        run: python tools/migrate_wx_listctrl_batch.py --write --path teamworks

      - name: Commit wx ListCtrl migration batch
        run: |
          if git diff --quiet -- teamworks; then
            echo "No migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks
          git commit -m "Frankenstein lot 2 — migrer en lot les appels wx ListCtrl"
          git push origin HEAD:${{ github.head_ref }}
