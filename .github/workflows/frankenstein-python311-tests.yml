name: Frankenstein Python 3.11 checks

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "teamworks/**/*.py"
      - "tools/**/*.py"
      - "tests/test_*.py"
      - ".github/workflows/frankenstein-python311-tests.yml"
  pull_request:
    branches:
      - master
    paths:
      - "teamworks/**/*.py"
      - "tools/**/*.py"
      - "tests/test_*.py"
      - ".github/workflows/frankenstein-python311-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python311-compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Test Python 3 CLI compatibility
        run: python -m pytest -q tests/test_python3_cli_compatibility.py

      - name: Test ListCtrl migrator
        run: python -m pytest -q tests/test_migrate_wx_listctrl.py

      - name: Test unicode migrator
        run: python -m pytest -q tests/test_migrate_python3_unicode.py

      - name: Test ListCtrl source compatibility
        run: python -m pytest -q tests/test_wx_listctrl_source_compatibility.py

      - name: Test SetStringItem migrator
        run: python -m pytest -q tests/test_migrate_wx_setstringitem.py

      - name: Test ObjectListView migration state
        run: python -m pytest -q tests/test_objectlistview_setstringitem_migration.py

      - name: Test completed migration audit
        run: python -m pytest -q tests/test_completed_python3_wx_migrations.py

      - name: Test wx image migrator
        run: python -m pytest -q tests/test_migrate_wx_empty_images.py

      - name: Block completed wx Classic APIs
        run: python -m pytest -q tests/test_no_completed_wx_classic_apis.py

      - name: Block Python 2 builtin names
        run: python -m pytest -q tests/test_no_python2_builtin_names.py

      - name: Inventory remaining wxPython Classic APIs
        if: always()
        run: |
          python tools/inventory_wx_classic_api.py --path teamworks \
            --json wx-classic-inventory.json \
            --markdown wx-classic-inventory.md
          cat wx-classic-inventory.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wxPython Classic inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wx-classic-inventory
          path: |
            wx-classic-inventory.json
            wx-classic-inventory.md
          if-no-files-found: error

      - name: Inventory remaining Python 3 runtime risks
        if: always()
        run: |
          python tools/inventory_python3_runtime_risks.py --path teamworks \
            --json python3-runtime-risks.json \
            --markdown python3-runtime-risks.md
          cat python3-runtime-risks.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python 3 runtime risk inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python3-runtime-risks
          path: |
            python3-runtime-risks.json
            python3-runtime-risks.md
          if-no-files-found: error

      - name: Inventory legacy compatibility branches
        if: always()
        run: |
          python tools/inventory_legacy_compatibility_branches.py --path teamworks \
            --json legacy-compatibility-branches.json \
            --markdown legacy-compatibility-branches.md
          cat legacy-compatibility-branches.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload legacy compatibility branch inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-compatibility-branches
          path: |
            legacy-compatibility-branches.json
            legacy-compatibility-branches.md
          if-no-files-found: error

      - name: Compile migration tools and tests
        run: |
          python -m compileall -q tools \
            tests/test_python3_cli_compatibility.py \
            tests/test_migrate_wx_listctrl.py \
            tests/test_migrate_python3_unicode.py \
            tests/test_wx_listctrl_source_compatibility.py \
            tests/test_migrate_wx_setstringitem.py \
            tests/test_objectlistview_setstringitem_migration.py \
            tests/test_completed_python3_wx_migrations.py \
            tests/test_migrate_wx_empty_images.py \
            tests/test_no_completed_wx_classic_apis.py \
            tests/test_no_python2_builtin_names.py

      - name: Report full legacy compile audit
        continue-on-error: true
        run: python -m compileall -q teamworks

  cleanup-python2-builtins-migration:
    if: github.event_name == 'push' && github.ref_name == 'frankenstein/python3-wxphoenix-lot2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean redundant post-migration constructs
        run: python tools/cleanup_python2_builtin_migration.py --write --path teamworks

      - name: Commit post-migration cleanup
        run: |
          if git diff --quiet -- teamworks; then
            echo "No cleanup required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks
          git commit -m "Frankenstein lot 2 — nettoyer les redondances Python 3"
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2

  migrate-ctrl-photo-six-py2:
    if: github.event_name == 'push' && github.ref_name == 'frankenstein/python3-wxphoenix-lot2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove dead six.PY2 decoding branches
        run: python tools/migrate_ctrl_photo_six_py2.py --write

      - name: Verify CTRL_Photo migration
        run: python tools/migrate_ctrl_photo_six_py2.py --check

      - name: Commit CTRL_Photo migration
        run: |
          if git diff --quiet -- teamworks/Ctrl/CTRL_Photo.py; then
            echo "No migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_Photo.py
          git commit -m "Frankenstein lot 2 — supprimer les branches six.PY2 de CTRL_Photo"
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
