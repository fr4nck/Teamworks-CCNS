name: tmp-frais-remboursement-money-chain
on:
  push:
    branches:
      - fix/0.9.2-frais-integrite-impression-distance
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.9.2-frais-integrite-impression-distance
      - name: Patch reimbursement monetary chain
        shell: python
        run: |
          from pathlib import Path
          p = Path('teamworks/Dlg/DLG_Saisie_remboursement.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('self.MajLabelRattachement(float(self.ctrl_montant.GetValue()))', 'self.MajLabelRattachement(_euros_decimal(self.ctrl_montant.GetValue()))')
          s = s.replace('''        distance = float(self.ctrl_distance.GetValue())\n        tarif = float(self.ctrl_tarif.GetValue())\n        self.ctrl_montant.SetValue(u"%.2f" % (distance * tarif))\n''', '''        montant = _montant_deplacement_decimal(\n            self.ctrl_distance.GetValue(),\n            self.ctrl_tarif.GetValue(),\n        )\n        self.ctrl_montant.SetValue(u"%.2f" % montant)\n''')
          s = s.replace('if float(valeur) == 0:', 'if _euros_decimal(valeur) == Decimal("0.00"):', 1)
          s = s.replace('montant = float(self.ctrl_montant.GetValue())', 'montant = str(_euros_decimal(self.ctrl_montant.GetValue()))', 1)
          p.write_text(s, encoding='utf-8')
      - name: Extend monetary tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_frais_decimal_money.py')
          s = p.read_text(encoding='utf-8')
          extra = '''\n\ndef test_reimbursement_active_money_chain_never_converts_amount_to_float():\n    import_source = _function_source(REMBOURSEMENT, 'Importation', 'SaisieRemboursement')\n    focus_source = _function_source(REMBOURSEMENT, 'montant_EvtKillFocus', 'SaisieRemboursement')\n    save_source = _function_source(REMBOURSEMENT, 'Sauvegarde', 'SaisieRemboursement')\n    assert 'MajLabelRattachement(float(' not in import_source\n    assert 'MajLabelRattachement(float(' not in focus_source\n    assert 'montant = float(self.ctrl_montant.GetValue())' not in save_source\n    assert 'montant = str(_euros_decimal(self.ctrl_montant.GetValue()))' in save_source\n\n\ndef test_reimbursement_zero_check_is_decimal():\n    source = _function_source(REMBOURSEMENT, 'OnBoutonOk', 'SaisieRemboursement')\n    assert 'if _euros_decimal(valeur) == Decimal("0.00"):' in source\n    assert 'if float(valeur) == 0:' not in source\n\n\ndef test_legacy_reimbursement_calculation_uses_decimal_rounding_too():\n    source = _function_source(REMBOURSEMENT, 'CalcMontantRmbst', 'SaisieRemboursement')\n    assert '_montant_deplacement_decimal(' in source\n    assert 'distance = float(' not in source\n    assert 'tarif = float(' not in source\n'''
          if 'test_reimbursement_active_money_chain_never_converts_amount_to_float' not in s:
              s += extra
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: |
          python -m compileall -q teamworks tests
          python -m pip install -q pytest
          python -m pytest -q tests/test_frais_integrite_wx.py tests/test_frais_decimal_money.py tests/test_frais_deplacement_atomicity.py
      - name: Commit and clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-frais-remboursement-money-chain.yml
          git add teamworks/Dlg/DLG_Saisie_remboursement.py tests/test_frais_decimal_money.py
          git commit -m "fix(frais): normaliser la chaîne monétaire remboursement"
          git push
