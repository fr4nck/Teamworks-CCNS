name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-windows-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r .github/requirements-windows-build.txt
          python -m pip freeze | Set-Content build-requirements.txt

      - name: Inventory every runtime import name
        shell: pwsh
        run: |
          $modules = @()

          Get-ChildItem teamworks -Recurse -Filter '*.py' -File | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath((Resolve-Path teamworks).Path, $_.FullName)
            $module = [System.IO.Path]::ChangeExtension($relative, $null) -replace '[\/]', '.'
            if ($module.EndsWith('.__init__')) {
              $module = $module.Substring(0, $module.Length - 9)
            }
            if ($module -and $module -ne '__init__') { $modules += $module }
          }

          foreach ($root in @('domain', 'application', 'infrastructure')) {
            Get-ChildItem $root -Recurse -Filter '*.py' -File | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              $module = [System.IO.Path]::ChangeExtension($relative, $null) -replace '[\/]', '.'
              if ($module.EndsWith('.__init__')) {
                $module = $module.Substring(0, $module.Length - 9)
              }
              if ($module) { $modules += $module }
            }
          }

          $modules = $modules | Sort-Object -Unique
          if ($modules.Count -lt 250) { throw "Runtime module inventory unexpectedly small: $($modules.Count)" }
          New-Item -ItemType Directory -Force build | Out-Null
          $modules | Set-Content build/internal-modules.txt

      - name: Build portable application
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $modules = Get-Content build/internal-modules.txt
          $pyinstallerArgs = @(
            '-m', 'PyInstaller',
            '--noconfirm',
            '--clean',
            '--windowed',
            '--onedir',
            '--name', 'Teamworks-CCNS',
            '--paths', '.',
            '--paths', 'teamworks',
            '--distpath', 'dist',
            '--workpath', 'build/pyinstaller',
            '--specpath', 'build/spec',
            '--collect-all', 'wx',
            '--collect-all', 'matplotlib',
            '--collect-all', 'reportlab',
            '--collect-all', 'PIL',
            '--hidden-import', 'mysql.connector',
            '--hidden-import', 'win32com.client'
          )
          foreach ($module in $modules) {
            $pyinstallerArgs += @('--hidden-import', $module)
          }
          $pyinstallerArgs += 'teamworks/Teamworks.py'
          python @pyinstallerArgs

          $package = 'dist/Teamworks-CCNS'
          Copy-Item teamworks/Static "$package/Static" -Recurse -Force
          if (Test-Path teamworks/Data) {
            Copy-Item teamworks/Data "$package/Data" -Recurse -Force
          }
          Copy-Item teamworks/Versions.txt "$package/Versions.txt" -Force
          Copy-Item VERSION "$package/VERSION" -Force
          Copy-Item ROADMAP.md "$package/ROADMAP.md" -Force
          Copy-Item build/internal-modules.txt "$package/INTERNAL-MODULES.txt" -Force
          Copy-Item build-requirements.txt "$package/BUILD-REQUIREMENTS.txt" -Force
          Set-Content -Path "$package/BUILD.txt" -Value "Teamworks-CCNS $version`nCommit $env:GITHUB_SHA"

      - name: Validate package structure
        shell: pwsh
        run: |
          $package = 'dist/Teamworks-CCNS'
          foreach ($required in @('Teamworks-CCNS.exe', 'Static', 'Versions.txt', 'VERSION', 'ROADMAP.md', 'INTERNAL-MODULES.txt', 'BUILD-REQUIREMENTS.txt')) {
            if (-not (Test-Path "$package/$required")) { throw "$required missing" }
          }
          if ((Get-Item "$package/Versions.txt").Length -eq 0) { throw 'Versions.txt is empty' }

          $manifest = @(Get-Content "$package/INTERNAL-MODULES.txt")
          if ($manifest.Count -lt 250) { throw "Packaged runtime manifest unexpectedly small: $($manifest.Count)" }

          foreach ($prefix in @('Ctrl.', 'Dlg.', 'Ol.', 'Utils.', 'CcnsCore.', 'domain.', 'application.', 'infrastructure.')) {
            if (-not ($manifest | Where-Object { $_.StartsWith($prefix) } | Select-Object -First 1)) {
              throw "No packaged runtime module found for prefix: $prefix"
            }
          }

      - name: Smoke test Windows executable
        shell: pwsh
        run: ./scripts/test_windows_executable.ps1

      - name: Upload smoke-test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Teamworks-CCNS-Windows-smoke-logs
          path: |
            teamworks-smoke.stdout.log
            teamworks-smoke.stderr.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Create and verify package integrity manifest
        shell: pwsh
        run: |
          $package = Resolve-Path 'dist/Teamworks-CCNS'
          $manifestPath = Join-Path $package.Path 'PACKAGE-SHA256SUMS.txt'

          Get-ChildItem $package -Recurse -File |
            Where-Object { $_.FullName -ne $manifestPath } |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($package.Path, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $relative"
            } | Set-Content $manifestPath -Encoding utf8

          $entries = @(Get-Content $manifestPath -Encoding utf8)
          if ($entries.Count -eq 0) { throw 'Package integrity manifest is empty' }

          foreach ($entry in $entries) {
            if ($entry -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid manifest entry: $entry" }
            $expected = $Matches[1]
            $relative = $Matches[2]
            $target = Join-Path $package.Path ($relative.Replace('/', [System.IO.Path]::DirectorySeparatorChar))
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw "Manifest target missing: $relative" }
            $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Manifest hash mismatch: $relative" }
          }

      - name: Create portable archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $archive = "Teamworks-CCNS-$version-windows-x64.zip"
          Compress-Archive -Path 'dist/Teamworks-CCNS/*' -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: Teamworks-CCNS-Windows-portable
          path: |
            Teamworks-CCNS-*-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
