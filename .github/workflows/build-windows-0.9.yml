name: Build Windows 0.9

on:
  pull_request:
    paths:
      - 'teamworks/**'
      - 'requirements.txt'
      - 'VERSION'
      - 'packaging/**'
      - '.github/workflows/build-windows-0.9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build one-folder application
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name Teamworks-CCNS `
            --paths teamworks `
            --distpath dist `
            --workpath build/pyinstaller `
            --specpath build/spec `
            --collect-all wx `
            --collect-all matplotlib `
            --collect-all reportlab `
            --collect-all PIL `
            --hidden-import mysql.connector `
            --hidden-import win32com.client `
            teamworks/Teamworks.py

          $package = 'dist/Teamworks-CCNS'
          Copy-Item teamworks/Static "$package/Static" -Recurse -Force
          if (Test-Path teamworks/Data) {
            Copy-Item teamworks/Data "$package/Data" -Recurse -Force
          }
          Copy-Item VERSION "$package/VERSION" -Force
          Set-Content -Path "$package/BUILD.txt" -Value "Teamworks-CCNS $version`nCommit $env:GITHUB_SHA"

      - name: Validate package structure
        shell: pwsh
        run: |
          $package = 'dist/Teamworks-CCNS'
          if (-not (Test-Path "$package/Teamworks-CCNS.exe")) { throw 'Executable missing' }
          if (-not (Test-Path "$package/Static")) { throw 'Static directory missing' }
          if (-not (Test-Path "$package/VERSION")) { throw 'VERSION missing' }
          Get-ChildItem $package | Select-Object Name, Length

      - name: Create archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path 'dist/Teamworks-CCNS/*' -DestinationPath "Teamworks-CCNS-$version-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Teamworks-CCNS-0.9.0-dev-windows-x64
          path: Teamworks-CCNS-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
