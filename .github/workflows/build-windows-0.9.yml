name: Build Windows 0.9

on:
  pull_request:
    paths:
      - 'teamworks/**'
      - 'domain/**'
      - 'application/**'
      - 'infrastructure/**'
      - 'requirements.txt'
      - 'VERSION'
      - 'packaging/**'
      - '.github/workflows/build-windows-0.9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Inventory every internal Python module
        shell: pwsh
        run: |
          $roots = @('teamworks', 'domain', 'application', 'infrastructure')
          $modules = foreach ($root in $roots) {
            Get-ChildItem $root -Recurse -Filter '*.py' -File | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
              $module = [System.IO.Path]::ChangeExtension($relative, $null) -replace '[\\/]', '.'
              if ($module.EndsWith('.__init__')) {
                $module = $module.Substring(0, $module.Length - 9)
              }
              if ($module -and $module -ne 'teamworks') { $module }
            }
          }
          $modules = $modules | Sort-Object -Unique
          if ($modules.Count -lt 250) { throw "Internal module inventory unexpectedly small: $($modules.Count)" }
          New-Item -ItemType Directory -Force build | Out-Null
          $modules | Set-Content build/internal-modules.txt
          Write-Host "Internal modules inventoried: $($modules.Count)"

      - name: Build one-folder application with complete internal imports
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $modules = Get-Content build/internal-modules.txt
          $pyinstallerArgs = @(
            '-m', 'PyInstaller',
            '--noconfirm',
            '--clean',
            '--windowed',
            '--onedir',
            '--name', 'Teamworks-CCNS',
            '--paths', '.',
            '--paths', 'teamworks',
            '--distpath', 'dist',
            '--workpath', 'build/pyinstaller',
            '--specpath', 'build/spec',
            '--collect-all', 'wx',
            '--collect-all', 'matplotlib',
            '--collect-all', 'reportlab',
            '--collect-all', 'PIL',
            '--hidden-import', 'mysql.connector',
            '--hidden-import', 'win32com.client'
          )
          foreach ($module in $modules) {
            $pyinstallerArgs += @('--hidden-import', $module)
          }
          $pyinstallerArgs += 'teamworks/Teamworks.py'
          python @pyinstallerArgs

          $package = 'dist/Teamworks-CCNS'
          Copy-Item teamworks/Static "$package/Static" -Recurse -Force
          if (Test-Path teamworks/Data) {
            Copy-Item teamworks/Data "$package/Data" -Recurse -Force
          }
          Copy-Item teamworks/Versions.txt "$package/Versions.txt" -Force
          Copy-Item VERSION "$package/VERSION" -Force
          Copy-Item build/internal-modules.txt "$package/INTERNAL-MODULES.txt" -Force
          Set-Content -Path "$package/BUILD.txt" -Value "Teamworks-CCNS $version`nCommit $env:GITHUB_SHA"

      - name: Validate package structure and representative dynamic modules
        shell: pwsh
        run: |
          $package = 'dist/Teamworks-CCNS'
          if (-not (Test-Path "$package/Teamworks-CCNS.exe")) { throw 'Executable missing' }
          if (-not (Test-Path "$package/Static")) { throw 'Static directory missing' }
          if (-not (Test-Path "$package/Versions.txt")) { throw 'Versions.txt required by FonctionsPerso.GetVersionTeamworks is missing' }
          if (-not (Test-Path "$package/VERSION")) { throw 'VERSION missing' }
          if (-not (Test-Path "$package/INTERNAL-MODULES.txt")) { throw 'Internal module manifest missing' }
          if ((Get-Item "$package/Versions.txt").Length -eq 0) { throw 'Versions.txt is empty' }

          $archive = python -m PyInstaller.utils.cliutils.archive_viewer -l "$package/Teamworks-CCNS.exe" 2>&1 | Out-String
          $requiredModules = @(
            'Gadget',
            'Ctrl.CTRL_Accueil',
            'Dlg.DLG_Saisie_question',
            'Ol.OL_candidatures',
            'Utils.UTILS_Adaptations',
            'CcnsCore.runtime_bridge',
            'domain.contracts',
            'application.control',
            'infrastructure.persistence'
          )
          foreach ($module in $requiredModules) {
            if ($archive -notmatch [regex]::Escape($module)) {
              throw "Required internal module missing from executable: $module"
            }
          }
          Get-ChildItem $package | Select-Object Name, Length

      - name: Create archive
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path 'dist/Teamworks-CCNS/*' -DestinationPath "Teamworks-CCNS-$version-windows-x64-r3.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Teamworks-CCNS-0.9.0-dev-windows-x64-r3
          path: Teamworks-CCNS-*-windows-x64-r3.zip
          if-no-files-found: error
          retention-days: 14