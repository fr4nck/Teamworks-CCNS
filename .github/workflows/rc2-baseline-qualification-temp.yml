name: Qualification baseline RC2

on:
  push:
    branches:
      - refactor/0.9.2-modular-foundations

permissions:
  contents: read

jobs:
  linux-baseline-rc2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python -m pip install --requirement .github/requirements-ci.txt
      - name: Compiler les modules consolides RC2
        run: >-
          python -m compileall -q
          teamworks/Ctrl/CTRL_Creation_contrat_p6.py
          teamworks/Ctrl/CTRL_Page_contrats_core.py
          teamworks/Dlg/DLG_Edition_DUE.py
          teamworks/Teamworks.py
          teamworks/Dlg/DLG_Publiposteur_lifecycle.py
          tests/test_dpae_due_rc1.py
          tests/test_redirect_flush_rc1.py
          tests/test_publipostage_native_lifecycle.py
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
          tests/test_secondary_contract_smoke_contract.py
      - name: Tests baseline RC2
        run: >-
          python -m pytest -q
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
          tests/test_secondary_contract_smoke_contract.py
          tests/test_dpae_due_rc1.py
          tests/test_redirect_flush_rc1.py
          tests/test_publipostage_native_lifecycle.py

  windows-baseline-rc2:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt
      - name: Installer le socle Windows
        shell: pwsh
        run: |
          python -m pip install --requirement requirements/python311-core.txt
          python -m pip install pytest
      - name: Compiler les modules consolides RC2
        shell: pwsh
        run: >-
          python -m compileall -q
          teamworks/Ctrl/CTRL_Creation_contrat_p6.py
          teamworks/Ctrl/CTRL_Page_contrats_core.py
          teamworks/Dlg/DLG_Edition_DUE.py
          teamworks/Teamworks.py
          teamworks/Dlg/DLG_Publiposteur_lifecycle.py
          tests/test_dpae_due_rc1.py
          tests/test_redirect_flush_rc1.py
          tests/test_publipostage_native_lifecycle.py
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
          tests/test_secondary_contract_smoke_contract.py
      - name: Tests baseline RC2 Windows
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_parametres_defaults_db_rc1.py
          tests/test_rc2_recette_regressions.py
          tests/test_secondary_contract_smoke_contract.py
          tests/test_dpae_due_rc1.py
          tests/test_redirect_flush_rc1.py
          tests/test_publipostage_native_lifecycle.py
