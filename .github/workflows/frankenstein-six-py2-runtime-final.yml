name: Frankenstein final six.PY2 runtime migration

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_six_py2_runtime_branches.py"
      - "tests/test_no_python2_builtin_names.py"
      - ".github/workflows/frankenstein-six-py2-runtime-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Apply final six.PY2 migration
        run: python tools/migrate_six_py2_runtime_branches.py --write

      - name: Verify migration idempotence
        run: python tools/migrate_six_py2_runtime_branches.py --check

      - name: Verify Python 2 runtime locks
        run: python -m pytest -q tests/test_no_python2_builtin_names.py

      - name: Compile changed modules
        run: |
          python -m py_compile \
            teamworks/Ctrl/CTRL_Editeur_email.py \
            teamworks/FonctionsPerso.py

      - name: Commit migrated modules
        run: |
          if git diff --quiet -- teamworks/Ctrl/CTRL_Editeur_email.py teamworks/FonctionsPerso.py; then
            echo "No final six.PY2 migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl/CTRL_Editeur_email.py teamworks/FonctionsPerso.py
          git commit -m "Frankenstein lot 2 — retirer les deux dernières branches six.PY2"
          git pull --rebase origin frankenstein/python3-wxphoenix-lot2
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
