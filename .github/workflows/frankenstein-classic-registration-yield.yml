name: Frankenstein remove Classic registration Yield

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "tools/migrate_classic_registration_yield.py"
      - ".github/workflows/frankenstein-classic-registration-yield.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: frankenstein/python3-wxphoenix-lot2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove Classic registration Yield
        run: python tools/migrate_classic_registration_yield.py --write

      - name: Verify migration idempotence
        run: python tools/migrate_classic_registration_yield.py --check

      - name: Compile migrated source
        run: python -m compileall -q teamworks/Dlg/DLG_Enregistrement.py

      - name: Commit migrated source
        run: |
          if git diff --quiet -- teamworks/Dlg/DLG_Enregistrement.py; then
            echo "No registration Yield migration required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Dlg/DLG_Enregistrement.py
          git commit -m "Frankenstein lot 2 — retirer le Yield Classic d’enregistrement"
          git pull --rebase origin frankenstein/python3-wxphoenix-lot2
          git push origin HEAD:frankenstein/python3-wxphoenix-lot2
