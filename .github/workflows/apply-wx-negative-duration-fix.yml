name: Apply wx negative duration fix

on:
  push:
    branches:
      - fix/wx-scenario-negative-duration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wx-scenario-negative-duration

      - name: Patch both OperationHeures implementations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('teamworks/Dlg/DLG_Scenario.py')
          text = path.read_text(encoding='utf-8')

          old = '''        # Formatage du résultat\n        if totalMinutes >= 0 :\n            nbreHeures = totalMinutes//60\n            nbreMinutes = totalMinutes-(nbreHeures*60)\n        else:\n            nbreHeures = -(-totalMinutes//60)\n            nbreMinutes = -(totalMinutes-(nbreHeures*60))\n        if len(str(nbreMinutes))==1 : nbreMinutes = str("0") + str(nbreMinutes)\n        duree = str(nbreHeures) + ":" + str(nbreMinutes)\n        if nbreHeures>=0 : duree = "+%s" % duree\n        return duree\n'''

          new = '''        # Formatage du résultat : le signe porte sur la durée complète,\n        # y compris lorsque la partie heures vaut zéro.\n        signe = "+" if totalMinutes >= 0 else "-"\n        totalMinutesAbs = abs(totalMinutes)\n        nbreHeures = totalMinutesAbs // 60\n        nbreMinutes = totalMinutesAbs % 60\n        return "%s%d:%02d" % (signe, nbreHeures, nbreMinutes)\n'''

          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 OperationHeures blocks, found {count}')

          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Install pytest
        run: python -m pip install pytest

      - name: Verify regression contract
        run: python -m pytest -q tests/test_wx_scenario_negative_duration_contract.py

      - name: Commit production fix and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-wx-negative-duration-fix.yml
          git add teamworks/Dlg/DLG_Scenario.py
          git commit -m "Fix wx scenario negative duration sign"
          git push origin HEAD:fix/wx-scenario-negative-duration
