name: Frankenstein Phoenix bulk inventory

on:
  pull_request:
    paths:
      - 'teamworks/**/*.py'
      - 'tools/find_redundant_phoenix_branches.py'
      - '.github/workflows/frankenstein-phoenix-bulk-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build redundant Phoenix inventory
        run: python tools/find_redundant_phoenix_branches.py teamworks/Ctrl > phoenix-findings.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-findings
          path: phoenix-findings.txt
          if-no-files-found: error
