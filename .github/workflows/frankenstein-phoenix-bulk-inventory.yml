name: Frankenstein Phoenix bulk inventory

on:
  pull_request:
    paths:
      - 'teamworks/**/*.py'
      - 'tools/find_redundant_phoenix_branches.py'
      - 'tools/rewrite_redundant_phoenix_branches.py'
      - '.github/workflows/frankenstein-phoenix-bulk-inventory.yml'

permissions:
  contents: write

jobs:
  inventory-and-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inventory before cleanup
        run: python tools/find_redundant_phoenix_branches.py teamworks/Ctrl > phoenix-findings-before.txt
      - name: Rewrite redundant Phoenix branches
        run: |
          python tools/rewrite_redundant_phoenix_branches.py \
            teamworks/Ctrl/CTRL_Creation_contrat_p4.py \
            teamworks/Ctrl/CTRL_Creation_modele_contrat_p1.py \
            teamworks/Ctrl/CTRL_Liste_fichiers.py \
            teamworks/Ctrl/CTRL_Page_generalites.py \
            teamworks/Ctrl/CTRL_Photo.py \
            teamworks/Ctrl/CTRL_Presences.py \
            teamworks/Ctrl/CTRL_thumbnailctrl.py
      - name: Compile cleaned modules
        run: |
          python -m py_compile \
            teamworks/Ctrl/CTRL_Creation_contrat_p4.py \
            teamworks/Ctrl/CTRL_Creation_modele_contrat_p1.py \
            teamworks/Ctrl/CTRL_Liste_fichiers.py \
            teamworks/Ctrl/CTRL_Page_generalites.py \
            teamworks/Ctrl/CTRL_Photo.py \
            teamworks/Ctrl/CTRL_Presences.py \
            teamworks/Ctrl/CTRL_thumbnailctrl.py
      - name: Verify no redundant branches remain
        run: python tools/find_redundant_phoenix_branches.py teamworks/Ctrl --check
      - name: Commit mechanical cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Ctrl
          git commit -m "refactor: supprimer les doublons Phoenix restants"
          git push origin HEAD:${{ github.head_ref }}
