name: Frankenstein Windows runtime smoke

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "teamworks/**/*.py"
      - "tools/smoke_import_teamworks.py"
      - "requirements/python311-core.txt"
      - ".github/workflows/frankenstein-windows-runtime-smoke.yml"
  pull_request:
    branches:
      - master
    paths:
      - "teamworks/**/*.py"
      - "tools/smoke_import_teamworks.py"
      - "requirements/python311-core.txt"
      - ".github/workflows/frankenstein-windows-runtime-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/python311-core.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/python311-core.txt

      - name: Compile complete source tree
        run: python -m compileall -q teamworks

      - name: Import Teamworks without launching the GUI
        run: python tools/smoke_import_teamworks.py
