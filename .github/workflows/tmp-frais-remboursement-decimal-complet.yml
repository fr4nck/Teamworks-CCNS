name: tmp-frais-remboursement-decimal-complet
on:
  push:
    branches:
      - fix/0.9.2-frais-integrite-impression-distance
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.9.2-frais-integrite-impression-distance
      - name: Patch remaining reimbursement float
        shell: python
        run: |
          from pathlib import Path
          p = Path('teamworks/Dlg/DLG_Saisie_remboursement.py')
          s = p.read_text(encoding='utf-8')
          helper = '''def _euros_decimal(value):\n    return Decimal(str(value)).quantize(CENTIME, rounding=ROUND_HALF_UP)\n'''
          expanded = helper + '''\ndef _montant_deplacement_decimal(distance, tarif_km):\n    return (Decimal(str(distance)) * Decimal(str(tarif_km))).quantize(CENTIME, rounding=ROUND_HALF_UP)\n'''
          if 'def _montant_deplacement_decimal(' not in s:
              if helper not in s:
                  raise SystemExit('helper euros introuvable')
              s = s.replace(helper, expanded, 1)
          s = s.replace('        self.montantRattache = 0\n        self.montantNonRattache = 0\n', '        self.montantRattache = Decimal("0.00")\n        self.montantNonRattache = Decimal("0.00")\n', 1)
          old = '            montant = float(distance) * float(tarif_km)\n'
          new = '            montant = _montant_deplacement_decimal(distance, tarif_km)\n'
          if old not in s:
              raise SystemExit('calcul float importation introuvable')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Extend regression test
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_frais_decimal_money.py')
          s = p.read_text(encoding='utf-8')
          addition = '''\n\ndef test_reimbursement_importation_uses_same_decimal_money_engine():\n    source = _function_source(REMBOURSEMENT, 'Importation', 'ListCtrl_deplacements')\n    assert 'float(distance) * float(tarif_km)' not in source\n    assert '_montant_deplacement_decimal(distance, tarif_km)' in source\n    assert 'self.montantRattache = Decimal("0.00")' in source\n\n\ndef test_reimbursement_line_money_rounding_is_deterministic():\n    ns = {'Decimal': Decimal}\n    helper = _function_source(REMBOURSEMENT, '_montant_deplacement_decimal')\n    exec('CENTIME = Decimal("0.01")\\nfrom decimal import ROUND_HALF_UP\\n' + helper, ns)\n    calc = ns['_montant_deplacement_decimal']\n    assert calc('3', '0.335') == Decimal('1.01')\n    assert calc('123', '0.55') == Decimal('67.65')\n'''
          if 'test_reimbursement_importation_uses_same_decimal_money_engine' not in s:
              s += addition
          p.write_text(s, encoding='utf-8')
      - name: Validate targeted motor tests
        run: |
          python -m compileall -q teamworks tests
          python -m pip install -q pytest
          python -m pytest -q tests/test_frais_integrite_wx.py tests/test_frais_decimal_money.py
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tmp-frais-remboursement-decimal-complet.yml
          git add teamworks/Dlg/DLG_Saisie_remboursement.py tests/test_frais_decimal_money.py
          git commit -m "fix(frais): unifier le calcul monétaire des remboursements"
          git push
