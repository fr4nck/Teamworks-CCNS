name: Frankenstein main window smoke mode

on:
  push:
    branches:
      - frankenstein/python3-wxphoenix-lot2
    paths:
      - "teamworks/Teamworks.py"
      - "tools/migrate_teamworks_main_window_smoke_mode.py"
      - ".github/workflows/frankenstein-main-window-smoke-mode.yml"
  pull_request:
    branches:
      - master
    paths:
      - "teamworks/Teamworks.py"
      - "tools/migrate_teamworks_main_window_smoke_mode.py"
      - ".github/workflows/frankenstein-main-window-smoke-mode.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply or verify main-window smoke mode
        run: python tools/migrate_teamworks_main_window_smoke_mode.py

      - name: Compile migrated entry point
        run: python -m py_compile teamworks/Teamworks.py

      - name: Verify deterministic smoke marker
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("teamworks/Teamworks.py").read_text(encoding="iso-8859-15")
          assert source.count('TEAMWORKS_SMOKE_MODE') == 1
          assert source.count('TEAMWORKS_SMOKE_MAIN_WINDOW_READY') == 1
          assert source.count('wx.CallLater(5000, self.ExitMainLoop)') == 1
          PY

      - name: Commit migration result
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- teamworks/Teamworks.py; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teamworks/Teamworks.py
          git commit -m "Frankenstein lot 2 — ajouter le smoke fonctionnel de la fenêtre principale"
          git push
