name: teamworks-dev

services:
  mysql55:
    image: mysql:5.5.62@sha256:c9c671d0c959183154313d6830d46f9a00d5937f97415c15ebd3c6844f6f1467
    platform: linux/amd64
    container_name: teamworks-mysql55
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${TEAMWORKS_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${TEAMWORKS_DB_NAME:-teamworks_dev}
      MYSQL_USER: ${TEAMWORKS_DB_USER:-teamworks}
      MYSQL_PASSWORD: ${TEAMWORKS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${TEAMWORKS_DB_PORT:-3307}:3306"
    volumes:
      - teamworks_mysql55_data:/var/lib/mysql
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  teamworks_mysql55_data:
